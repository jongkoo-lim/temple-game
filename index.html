// ---------- 보물 상자 (보스 처치 보상) ----------
function openChestIfNear(){
  if(!chest || !chest.risen || chest.opened) return false;
  const c = chest;
  if(!overlap(p, { x:c.x-14, y:c.y-14, w:c.w+28, h:c.h+28 })) return false;
  // 개봉!
  c.opened=true; c.openT=0; sfx('clear'); shake=7;
  score += 1000;
  showToast('보물 발견! 전설의 보석 +1000', 2.8);
  const cols = ['#ffd75a','#7fe3a0','#ff8fb3','#9fd8ff'];
  for(let i=0;i<28;i++) burst(c.x+c.w/2, c.y+6, cols[i%4], 1);
  return true;
}
function updateChest(dt){
  if(!chest) return;
  const c = chest;
  if(!c.risen){
    // 바닥에서 1.8초에 걸쳐 솟아오름 (부드러운 가속)
    c.rise += dt/1.8;
    if(Math.random()<0.35) burst(c.x+Math.random()*c.w, 11*TILE, '#bfa77a', 2);   // 올라오며 흙먼지
    if(c.rise>=1){
      c.rise=1; c.risen=true; sfx('slam'); shake=6;
      burst(c.x+c.w/2, 11*TILE, '#cfc8b0', 16);
      showToast('오래된 보물 상자! 가까이서 공격(Space)으로 열어보자', 2.6);
    }
  }
  else if(!c.opened){
    // 개봉은 tryAttack()의 openChestIfNear()가 담당 (탄약 없는 권총으로도 열 수 있게)
  }
  else {
    c.openT += dt;
    // 보석 분수 : 상자에서 보석들이 계속 솟구침 (2.5초)
    if(c.openT<2.5 && Math.random()<0.5){
      const cols = ['#ffd75a','#7fe3a0','#ff8fb3','#9fd8ff'];
      particles.push({ x:c.x+c.w/2+(Math.random()*20-10), y:c.y+8,
        vx:(Math.random()*2-1)*1.3, vy:-(2.2+Math.random()*2.8),
        life:0.8+Math.random()*0.6, color:cols[(Math.random()*4)|0], s:2+Math.random()*2 });
    }
    if(c.openT>3.4 && state==='play'){
      if(stage===1){ state='interlude'; interT=0; sfx('door'); }  // ★ S1 클리어 → 연출 후 S2로
      else { state='clear'; clearTimer=1.4; sfx('clear'); }      // S2 클리어 → 엔딩 크레딧
    }
  }
}

// ---------- 파서: 수집품 그리드->리스트 ----------
function collectGemsFromGrid(){
  gemsList.length = 0; whipItems.length = 0; pistolItems.length = 0; heartsList.length = 0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(level[r][c]==='g'){
      gemsList.push({ x:c*TILE+6, y:r*TILE+4, w:20, h:24, t:0 });
    }
    else if(level[r][c]==='w'){
      // 채찍 강화 아이템 (먹으면 채찍 범위가 누적 증가)
      whipItems.push({ x:c*TILE+6, y:r*TILE+4, w:20, h:24, t:0 });
    }
    else if(level[r][c]==='p'){
      // 권총 아이템 (먹으면 무기 교체 / 레벨업+탄환 추가)
      pistolItems.push({ x:c*TILE+6, y:r*TILE+4, w:20, h:24, t:0 });
    }
    else if(level[r][c]==='h'){
      // 하트 (목숨 1 회복)
      heartsList.push({ x:c*TILE+6, y:r*TILE+4, w:20, h:24, t:0 });
    }
  }
}

// ============================================================
//  렌더링
// ============================================================
function render(){
  ctx.clearRect(0,0,W,H);
  const sx = shake>0 ? (Math.random()*2-1)*Math.min(shake,6) : 0;
  const sy = shake>0 ? (Math.random()*2-1)*Math.min(shake,6) : 0;
  ctx.save();
  ctx.translate(sx,sy);

  drawBackground();
  drawTiles();

  // 수집품
  for(const g of gemsList){ g.t+=0.12; drawGem(g); }
  for(const w of whipItems){ w.t+=0.12; drawWhipItem(w); }
  for(const it of pistolItems){ it.t+=0.12; drawPistolItem(it); }
  for(const h of heartsList){ h.t+=0.12; drawHeartItem(h); }
  // 탄환
  for(const bl of bullets) drawBullet(bl);
  // ★ [S2] 원주민 독침
  for(const d of darts) drawDart(d);

  // 이동발판
  for(const pl of platforms) drawPlatform(pl);
  // ★ [S2] 그네 넝쿨
  for(const v of vines) drawVineSwing(v);

  // 블록
  for(const b of blocks) drawBlock(b);

  // 적
  for(const e of enemies) drawEnemy(e);

  // 벗겨진 모자
  for(const h of hats) drawHat(h);

  // 회전 칼날
  for(const bd of blades) drawBlade(bd);

  // 보스
  if(boss && (bossActive||bossDead)) drawBoss();
  if(chest) drawChest();

  // 플레이어
  if(state!=='clear'||clearTimer>0) drawPlayer();

  // 파티클
  for(const pt of particles){
    ctx.globalAlpha = Math.max(0,pt.life/0.9);
    ctx.fillStyle = pt.color; ctx.fillRect(pt.x - camX, pt.y, pt.s, pt.s);
  }
  ctx.globalAlpha = 1;

  // ★ 점수 팝업
  drawPopups();

  ctx.restore();

  // HUD
  drawHUD();

  // 오버레이
  if(state==='menu') drawMenu();
  else if(state==='clear') drawClear();
  else if(state==='gameover') drawGameOver();
  else if(state==='interlude') drawInterlude();   // ★ S1→S2 연출 (전체 화면 덮음)
  if(paused && state==='play') drawPause();
  if(state==='play' && bossActive && !bossDead) drawBossBar();
  if(state==='play' && !bossActive && center(p).x > 158*TILE){
    drawMessage(stage===2 ? '정글의 족장이 다가오고 있다' : '보스가 다가오고 있다', 200);
  }
}

// 배경용 결정론적 난수 : 프레임마다 값이 흔들리지 않아 배경이 깜빡이지 않음
function bhash(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }

function drawBackground(){
  if(stage===2){ drawJungleBackground(); return; }   // ★ [S2] 정글 배경
  // 어두운 신전 그라데이션
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#141009');
  grad.addColorStop(0.55,'#1e150d');
  grad.addColorStop(1,'#0d0906');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // ===== [원경] 고대 벽화/문양 패널 (parallax 0.25, 매우 옅게) =====
  const px = camX*0.25, panW = 240;
  for(let i=Math.floor(px/panW)-1, e=Math.floor((px+W)/panW)+1; i<=e; i++){
    const x = i*panW - px, hv = bhash(i*7+3);
    ctx.strokeStyle='rgba(160,125,72,0.10)'; ctx.lineWidth=2;
    ctx.strokeRect(x+34, 132, panW-68, 188);                  // 패널 테두리
    ctx.strokeStyle='rgba(160,125,72,0.15)'; ctx.lineWidth=1.5;
    if(hv<0.55){                                              // 태양 문양
      const cx=x+panW/2, cy=226;
      ctx.beginPath(); ctx.arc(cx,cy,25,0,Math.PI*2); ctx.stroke();
      for(let k=0;k<8;k++){ const a=k*Math.PI/4;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*31, cy+Math.sin(a)*31);
        ctx.lineTo(cx+Math.cos(a)*43, cy+Math.sin(a)*43); ctx.stroke(); }
    } else {                                                  // 거대 눈 문양
      const cx=x+panW/2, cy=222;
      ctx.beginPath(); ctx.ellipse(cx,cy,32,18,0,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.stroke();
    }
    ctx.beginPath();                                          // 지그재그 띠
    for(let z=0;z<6;z++){ const zx=x+44+z*((panW-88)/6), zy=160+(z%2?13:0);
      z===0?ctx.moveTo(zx,zy):ctx.lineTo(zx,zy); }
    ctx.stroke();
    ctx.fillStyle='rgba(160,125,72,0.14)';                    // 점 문양줄
    for(let d=0;d<8;d++) ctx.fillRect(x+48+d*17, 294, 4, 4);
  }

  // ===== [원경] 석재 줄눈 패턴 (은은하게, 결정론적) =====
  ctx.globalAlpha=0.10;
  for(let x=-64;x<W+64;x+=64){
    ctx.fillStyle = Math.floor((x+px)/64)%2 ? '#3a2c1a' : '#2c2113';
    ctx.fillRect(x-(px%64), 0, 63, H);
  }
  ctx.globalAlpha=1;

  // ===== [중경] 기둥 (parallax 0.42) : 멀쩡/무너진 기둥 + 덩굴 + 거미줄 =====
  const p2x = camX*0.42, gap = 300;
  for(let i=Math.floor(p2x/gap)-1, e=Math.floor((p2x+W)/gap)+1; i<=e; i++){
    const hv = bhash(i*13+11);
    drawBgPillar(i*gap + hv*36 - p2x, hv, i);
  }

  // ===== [중경] 천장에서 드리운 덩굴 + 천장 거미줄 =====
  const vgap = 150;
  for(let i=Math.floor(p2x/vgap)-1, e=Math.floor((p2x+W)/vgap)+1; i<=e; i++){
    const hv = bhash(i*29+5);
    const x = i*vgap + hv*60 - p2x;
    if(hv<0.3){ drawWeb(x+10, 4, 24+hv*70); continue; }       // 드문 천장 거미줄
    const len = 40 + hv*110;
    ctx.strokeStyle='rgba(38,52,28,0.7)'; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,0);
    ctx.bezierCurveTo(x+8, len*0.4, x-8, len*0.7, x+4, len);
    ctx.stroke();
    ctx.fillStyle='rgba(44,60,30,0.55)';                      // 잎
    for(let L=0;L<3;L++){
      const ly=len*(0.35+L*0.25);
      ctx.beginPath(); ctx.ellipse(x+(L%2?7:-5), ly, 5, 3, (L%2?0.6:-0.6), 0, Math.PI*2); ctx.fill();
    }
  }

  // ===== 횃불 : 월드 좌표 고정 (레벨 벽면에 320px 간격으로 설치된 것처럼 제자리) =====
  const tw = 320;
  for(let i=Math.floor(camX/tw)-1, e=Math.floor((camX+W)/tw)+1; i<=e; i++){
    const tx = i*tw + 90 - camX;
    const flick = Math.random()*4;
    const fg = ctx.createRadialGradient(tx, 208, 4, tx, 208, 95);
    fg.addColorStop(0,'rgba(255,175,55,0.18)');
    fg.addColorStop(1,'rgba(255,175,55,0)');
    ctx.fillStyle=fg; ctx.fillRect(tx-95, 115, 190, 190);
    ctx.fillStyle='#241a10'; ctx.fillRect(tx-3, 214, 6, 16);   // 횃대
    ctx.fillStyle='rgba(255,160,50,0.85)';                     // 불꽃
    ctx.beginPath(); ctx.ellipse(tx, 210+flick*0.5, 4, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,230,140,0.9)';
    ctx.beginPath(); ctx.ellipse(tx, 212+flick*0.5, 2, 3.5, 0, 0, Math.PI*2); ctx.fill();
  }
}

// 배경 기둥 한 개 : 무너진 기둥은 부러진 채 + 바닥에 쓰러진 상단 조각
function drawBgPillar(x, hv, idx){
  const bw = 40, broken = hv>0.55, baseY = H-24;
  const stone = '#332a1c';
  // 주춧돌
  ctx.fillStyle='#2c2416'; ctx.fillRect(x-8, baseY, bw+16, 24);
  ctx.fillStyle='#3a2f1e'; ctx.fillRect(x-8, baseY, bw+16, 6);
  // 몸통
  const topY = broken ? 90 + hv*160 : 14;
  ctx.fillStyle=stone; ctx.fillRect(x, topY, bw, baseY-topY);
  ctx.fillStyle='rgba(255,210,150,0.06)'; ctx.fillRect(x+3, topY, 6, baseY-topY);  // 광택
  ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
  for(let f=1;f<4;f++){ ctx.beginPath(); ctx.moveTo(x+f*bw/4, topY+2); ctx.lineTo(x+f*bw/4, baseY-2); ctx.stroke(); }
  if(!broken){
    ctx.fillStyle='#2c2416'; ctx.fillRect(x-6, 0, bw+12, 16);   // 천장 받침(capital)
  } else {
    // 부러진 톱니 상단
    ctx.fillStyle=stone;
    ctx.beginPath(); ctx.moveTo(x, topY+12);
    for(let j=0;j<4;j++) ctx.lineTo(x+j*bw/4+(bw/8), topY+(j%2?2:9));
    ctx.lineTo(x+bw, topY+12); ctx.closePath(); ctx.fill();
    // 바닥에 쓰러진 기둥 조각
    ctx.save(); ctx.translate(x+bw+26, baseY+2); ctx.rotate(-0.08);
    ctx.fillStyle='#302818'; ctx.fillRect(-34, -14, 68, 14);
    ctx.strokeStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.moveTo(-17,-12); ctx.lineTo(-17,-2); ctx.moveTo(17,-12); ctx.lineTo(17,-2); ctx.stroke();
    ctx.restore();
  }
  // 덩굴이 기둥을 휘감음 (70%)
  if(bhash(idx*31+7)<0.7){
    ctx.strokeStyle='rgba(40,56,28,0.75)'; ctx.lineWidth=2.5;
    const wrapN = broken?3:4;
    for(let w2=0; w2<wrapN; w2++){
      const wy = topY+30 + w2*((baseY-topY-50)/(wrapN-1)) + bhash(idx*3+w2)*18;
      ctx.beginPath(); ctx.moveTo(x-4, wy);
      ctx.bezierCurveTo(x+bw*0.3, wy+9, x+bw*0.7, wy-9, x+bw+4, wy+4);
      ctx.stroke();
      ctx.fillStyle='rgba(46,64,32,0.6)';
      ctx.beginPath(); ctx.ellipse(x+bw*0.5, wy+3, 5, 3, 0.4, 0, Math.PI*2); ctx.fill();
    }
  }
  // 기둥 상단 거미줄 (45%)
  if(bhash(idx*17+2)<0.45) drawWeb(x+bw+2, broken? topY+8 : 18, 30+hv*14);
}

// 4분의 1 거미줄 : 앵커에서 아래+오른쪽으로 부챗살과 호
function drawWeb(ax, ay, r){
  ctx.strokeStyle='rgba(205,195,175,0.15)'; ctx.lineWidth=1;
  for(const t of [0.15, 0.5, 0.85]){
    ctx.beginPath(); ctx.moveTo(ax,ay);
    ctx.lineTo(ax+Math.cos(t)*r, ay+Math.sin(t)*r); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+r*0.9, ay); ctx.stroke();
  for(let k=1;k<=3;k++){
    ctx.beginPath(); ctx.arc(ax, ay, r*k/3*0.9, 0, Math.PI/2*0.9); ctx.stroke();
  }
}

// ============================================================
//  ★ [Stage 2] 정글 배경 : 울창한 밀림 (빛기둥 + 나무 실루엣 + 반딧불)
// ============================================================
function drawJungleBackground(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#14240e'); grad.addColorStop(0.55,'#1b3013'); grad.addColorStop(1,'#0a1407');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // 빛기둥 (god rays) : 나무 사이로 쏟아지는 햇살
  const rx = camX*0.12;
  ctx.fillStyle='rgba(215,240,150,0.05)';
  for(let i=Math.floor(rx/270)-1, e2=Math.floor((rx+W)/270)+1; i<=e2; i++){
    const x=i*270-rx+30;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+64,0);
    ctx.lineTo(x+150,H); ctx.lineTo(x+46,H); ctx.closePath(); ctx.fill();
  }

  // [원경] 나무 능선 실루엣 (parallax 0.25)
  const px=camX*0.25;
  ctx.fillStyle='#0f1c09';
  ctx.beginPath(); ctx.moveTo(-4,H);
  for(let x=-4;x<=W+4;x+=32){
    const wx=x+px;
    ctx.lineTo(x, 250 - (Math.sin(wx*0.012)*46 + Math.sin(wx*0.031)*20 + 66));
  }
  ctx.lineTo(W+4,H); ctx.closePath(); ctx.fill();

  // [중경] 큰 정글 나무 (parallax 0.42)
  const p2x = camX*0.42, gap = 330;
  for(let i=Math.floor(p2x/gap)-1, e2=Math.floor((p2x+W)/gap)+1; i<=e2; i++){
    const hv = bhash(i*13+11);
    drawJungleTree(i*gap + hv*40 - p2x, hv, i);
  }

  // [중경] 천장에서 드리운 덩굴 + 잎 (신전보다 짙은 초록)
  const vgap = 150;
  for(let i=Math.floor(p2x/vgap)-1, e2=Math.floor((p2x+W)/vgap)+1; i<=e2; i++){
    const hv = bhash(i*29+5);
    const x = i*vgap + hv*60 - p2x;
    const len = 44 + hv*120;
    ctx.strokeStyle='rgba(46,72,30,0.8)'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,0);
    ctx.bezierCurveTo(x+8, len*0.4, x-8, len*0.7, x+4, len);
    ctx.stroke();
    ctx.fillStyle='rgba(58,88,36,0.7)';
    for(let L=0;L<3;L++){
      const ly=len*(0.35+L*0.25);
      ctx.beginPath(); ctx.ellipse(x+(L%2?8:-6), ly, 6, 3.5, (L%2?0.6:-0.6), 0, Math.PI*2); ctx.fill();
    }
  }

  // 반딧불 : 느리게 떠다니며 반짝이는 불빛 (월드 좌표 연동)
  const t = performance.now()*0.001;
  for(let i=0;i<16;i++){
    const span = W+140;
    let sx = (i*197 - camX*0.55) % span; if(sx<0) sx += span; sx -= 70;
    const sy = 90 + bhash(i*11+3)*360 + Math.sin(t*1.2+i*2.1)*16;
    const tw = 0.5+0.5*Math.sin(t*3.1+i*1.9);
    ctx.fillStyle='rgba(215,255,140,'+(0.10+0.38*tw)+')';
    ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(215,255,140,'+(0.05+0.16*tw)+')';
    ctx.beginPath(); ctx.arc(sx, sy, 5.5, 0, Math.PI*2); ctx.fill();
  }
}
// 정글 나무 한 그루 : 굵은 줄기 + 우산 canopy + 줄기를 휘감은 덩굴
function drawJungleTree(x, hv, idx){
  const baseY = H-26, topY = 120 + hv*70, tw = 22 + hv*16;
  // 줄기 + 뿌리 벌어짐
  ctx.fillStyle='#1a130a'; ctx.fillRect(x-tw/2, topY, tw, baseY-topY);
  ctx.beginPath(); ctx.moveTo(x-tw/2-12, baseY); ctx.lineTo(x-tw/2, topY+30);
  ctx.lineTo(x+tw/2, topY+30); ctx.lineTo(x+tw/2+12, baseY); ctx.closePath(); ctx.fill();
  // 가지
  ctx.strokeStyle='#1a130a'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x, topY+40); ctx.lineTo(x-tw-8, topY-14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, topY+26); ctx.lineTo(x+tw+10, topY-24); ctx.stroke();
  // canopy 블롭
  ctx.fillStyle='#13260b';
  for(const bl of [[0,-16,58+hv*20],[-tw-10,-8,36],[tw+12,-16,40]]){
    ctx.beginPath(); ctx.ellipse(x+bl[0], topY+bl[1]-30, bl[2], bl[2]*0.62, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#1a3310';
  ctx.beginPath(); ctx.ellipse(x-6, topY-52, 40+hv*12, 24, 0, 0, Math.PI*2); ctx.fill();
  // 줄기를 휘감는 덩굴
  ctx.strokeStyle='rgba(52,80,32,0.8)'; ctx.lineWidth=2.5;
  for(let w2=0; w2<3; w2++){
    const wy = topY+34 + w2*46 + bhash(idx*7+w2)*20;
    ctx.beginPath(); ctx.moveTo(x-tw/2-3, wy);
    ctx.bezierCurveTo(x, wy+10, x, wy-10, x+tw/2+3, wy+4); ctx.stroke();
  }
}

function drawTiles(){
  const c0 = Math.max(0, Math.floor(camX/TILE)-1);
  const c1 = Math.min(COLS-1, Math.floor((camX+W)/TILE)+1);
  for(let r=0;r<ROWS;r++){
    for(let c=c0;c<=c1;c++){
      const ch = level[r][c];
      const x = c*TILE-camX, y = r*TILE;
      if(ch==='#'){
        if(stage===2){
          // [S2] 흙바닥 + 잔디
          ctx.fillStyle = (r+(c>>1))%2 ? '#3a2e1c' : '#443623';
          ctx.fillRect(x,y,TILE,TILE);
          if(r-1<0 || !isSolidAt(c, r-1)){          // 위가 뚫려 있으면 잔디 돋움
            ctx.fillStyle='#3f6b28'; ctx.fillRect(x,y,TILE,6);
            ctx.fillStyle='#548a34';
            ctx.fillRect(x+4,y-3,2,5); ctx.fillRect(x+13,y-4,2,6); ctx.fillRect(x+24,y-2,2,4);
          }
          ctx.fillStyle='rgba(0,0,0,0.18)';
          ctx.fillRect(x+5,y+12,9,3); ctx.fillRect(x+17,y+21,8,3);
        } else {
        // 돌 블록
        ctx.fillStyle = (r+ (c>>1))%2 ? '#4d4029' : '#574933';
        ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='rgba(0,0,0,0.45)';
        ctx.lineWidth=1;
        ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
        // 질감
        ctx.fillStyle='rgba(0,0,0,0.15)';
        ctx.fillRect(x+6,y+10,10,3);
        ctx.fillRect(x+16,y+22,8,3);
        }
      } else if(ch==='K'){
        if(stage===2){
          // [S2] 통나무 바닥
          ctx.fillStyle = ((r^c)&1) ? '#6b4a26' : '#785630';
          ctx.fillRect(x,y,TILE,TILE);
          ctx.strokeStyle='rgba(30,18,6,0.55)'; ctx.lineWidth=1;
          ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
          ctx.fillStyle='rgba(30,18,6,0.4)';
          ctx.fillRect(x+4,y+14,TILE-8,2);
        } else {
        // 용암 위 해골 섬(뼈 타일)
        ctx.fillStyle = ((r^c)&1) ? '#cdc6b6' : '#d8d2c3';
        ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='rgba(70,60,40,0.55)'; ctx.lineWidth=1;
        ctx.strokeRect(x+0.5,y+0.5,TILE-1,TILE-1);
        // 이빨/해골 장식
        ctx.fillStyle='#3a2e18';
        ctx.beginPath(); ctx.arc(x+10,y+12,3,0,Math.PI*2); ctx.arc(x+22,y+12,3,0,Math.PI*2); ctx.fill();
        ctx.fillRect(x+8,y+20,2,6); ctx.fillRect(x+13,y+20,2,6); ctx.fillRect(x+18,y+20,2,6); ctx.fillRect(x+23,y+20,2,6);
        }
      } else if(ch==='W'){
        // ★ [S2] 넝쿨 장애물 : 채찍/탄환으로 절단 가능 (isSolidAt에서 고체 취급)
        ctx.fillStyle='#1c2a12'; ctx.fillRect(x,y,TILE,TILE);
        ctx.strokeStyle='#4a6b26'; ctx.lineWidth=3; ctx.lineCap='round';
        for(let k=0;k<3;k++){
          ctx.beginPath(); ctx.moveTo(x+6+k*10, y);
          ctx.bezierCurveTo(x+2+k*10, y+12, x+12+k*10, y+20, x+6+k*10, y+TILE);
          ctx.stroke();
        }
        ctx.fillStyle='#5a8a30';
        for(let k=0;k<4;k++){
          ctx.beginPath(); ctx.ellipse(x+8+k*6, y+6+(k%2)*16, 4, 2.5, 0.7, 0, Math.PI*2); ctx.fill();
        }
      } else if(ch==='D'){
        // 신전의 문 (doorLift만큼 위로 슬라이드하여 열림)
        if(!doorOpen || doorLift>0){
          const dy = y - doorLift;
          ctx.fillStyle='#6e6446'; ctx.fillRect(x+2, dy, TILE-4, DOOR_H+4); // 문짝
          ctx.fillStyle='#8d8058'; ctx.fillRect(x+2, dy, TILE-4, 5);        // 윗장식
          ctx.fillStyle='#2f2817'; ctx.fillRect(x+2, dy+DOOR_H-6, TILE-4, 6); // 아랫단
          ctx.fillStyle='#120c06';
          ctx.beginPath(); ctx.arc(x+TILE/2, dy+DOOR_H/2-12, 8, 0, Math.PI*2); ctx.fill(); // 눈 장식
          ctx.fillStyle='#d8cf9a'; ctx.beginPath(); ctx.arc(x+TILE/2, dy+DOOR_H/2-12, 3, 0, Math.PI*2); ctx.fill();
        }
      } else if(ch==='.'){
        // 용암 구덩이 (어레나 영역 colARENAL~ARENAR, row12~17만)
        if(c>=ARENAL && c<=ARENAR && r>=12 && r<=17) drawLavaTile(x,y);
      } else if(ch==='^'){
        drawSpike(x,y);
      } else if(ch==='L'){
        if(stage===2){
          // [S2] 덩굴 로프 사다리
          ctx.fillStyle='rgba(52,80,32,0.7)';
          ctx.fillRect(x+13, y+1, 6, TILE-2);
          ctx.fillStyle='rgba(70,104,44,0.9)';
          for(let yy=4; yy<TILE; yy+=9) ctx.fillRect(x+6, y+yy, TILE-12, 4);
        } else {
        // 사다리(덩굴): 높이 5칸 이상 벽을 타고 오르는 지지대
        ctx.fillStyle='rgba(70,50,25,0.45)';
        ctx.fillRect(x+14, y+1, 4, TILE-2);        // 중앙 세로대
        ctx.fillStyle='rgba(110,85,40,0.85)';
        for(let yy=4; yy<TILE; yy+=9) ctx.fillRect(x+6, y+yy, TILE-12, 3);   // 가로대
        ctx.fillStyle='rgba(160,140,60,0.5)';      // 덩굴 강조
        ctx.fillRect(x+17, y+6, 3, 4); ctx.fillRect(x+17, y+18, 3, 4);
        }
      } else if(ch==='S'){
        // 스위치 플레이트
        const active = gateOpen;
        ctx.beginPath(); ctx.arc(x+TILE/2, y+TILE*0.9, 10, 0, Math.PI*2);
        ctx.fillStyle = active ? '#7fdf7f' : '#5a4a20';
        ctx.fill();
        ctx.strokeStyle = active ? '#dfff' : '#7a6a30';
        ctx.lineWidth=2; ctx.stroke();
      } else if(ch==='G' || ch==='A'){
        // 게이트(철창)
        const closed = ch==='G' ? (gateOpen?0:1) : (bossActive?1:0);
        ctx.fillStyle = closed? 'rgba(120,120,120,0.55)' : 'rgba(120,120,120,0.15)';
        ctx.fillRect(x+2,y,TILE-4,TILE);
        ctx.fillStyle='rgba(0,0,0,0.4)';
        for(let yy=0; yy<TILE; yy+=10) ctx.fillRect(x,y+yy,TILE,2);
        ctx.fillStyle='#ddd'; ctx.fillRect(x+2,y,TILE-4,2);
        ctx.fillRect(x+2,y+TILE-3,TILE-4,3);
      }
    }
  }
}
function drawLavaTile(x,y){
  // 굽이치는 용암 배경 (보스 어레나 아래) / [S2] 늪지물
  const t = performance.now()*0.001;
  if(stage===2){
    ctx.fillStyle = ((((x>>5)+(Math.floor(t*2)&1))&1) ? '#123038' : '#173b46');
    ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x,y,TILE,2);
    ctx.fillStyle='rgba(140,220,230,0.25)';
    const bx2 = x+10 + ((Math.sin(x*0.13 + t*2.2 + y)*6)|0);
    const by2 = y+14 + ((Math.cos(x*0.09 + t*1.6 + y)*5)|0);
    ctx.beginPath(); ctx.arc(bx2, by2, 2.4, 0, Math.PI*2); ctx.fill();
    return;
  }
  ctx.fillStyle = ((((x>>5)+(Math.floor(t*2)&1))&1) ? '#7a2008' : '#8a2a0a');
  ctx.fillRect(x,y,TILE,TILE);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x,y,TILE,2);       // 위쪽 살짝 어둡게
  ctx.fillStyle='rgba(255,130,25,0.4)';
  const bx = x+10 + ((Math.sin(x*0.13 + t*2.5 + y)*6)|0);
  const by = y+14 + ((Math.cos(x*0.09 + t*1.8 + y)*5)|0);
  ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();   // 버블
}
function drawSpike(x,y){
  if(stage===2){
    // [S2] 가시덤불 (독가시)
    ctx.fillStyle='#3c4c1e';
    ctx.beginPath();
    ctx.moveTo(x+2, y+TILE);
    ctx.lineTo(x+TILE/2, y+6);
    ctx.lineTo(x+TILE-2, y+TILE);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#5c7a2c';
    ctx.beginPath();
    ctx.moveTo(x+2, y+TILE);
    ctx.lineTo(x+TILE/2, y+6);
    ctx.lineTo(x+TILE*0.3, y+TILE);
    ctx.closePath(); ctx.fill();
    return;
  }
  ctx.fillStyle='#9a8a66';  ctx.beginPath();
  ctx.moveTo(x+2, y+TILE);
  ctx.lineTo(x+TILE/2, y+8);
  ctx.lineTo(x+TILE-2, y+TILE);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#c8b88f';
  ctx.beginPath();
  ctx.moveTo(x+2, y+TILE);
  ctx.lineTo(x+TILE/2, y+8);
  ctx.lineTo(x+TILE*0.3, y+TILE);
  ctx.closePath(); ctx.fill();
}
function drawGem(g){
  ctx.save(); ctx.translate(g.x - camX + 10, g.y + 12); 
  const bob = Math.sin(g.t*2)*2;
  ctx.translate(0,bob);
  ctx.rotate(Math.sin(g.t)*0.2);
  ctx.fillStyle='#ffd75a';
  ctx.beginPath();
  ctx.moveTo(0,-9); ctx.lineTo(8,0); ctx.lineTo(4,9); ctx.lineTo(-4,9); ctx.lineTo(-8,0);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(90,50,0,0.6)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}
function drawWhipItem(w){
  // 감아놓은 채찍 아이템 (먹으면 채찍 범위 증가)
  ctx.save(); ctx.translate(w.x - camX + 10, w.y + 12 + Math.sin(w.t*2)*2);
  ctx.rotate(Math.sin(w.t)*0.15);
  ctx.strokeStyle='#7a5a24'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(0,0,7,0.4,Math.PI*2.1); ctx.stroke();
  ctx.strokeStyle='#9a7a34'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,4,1.2,Math.PI*2.2); ctx.stroke();
  ctx.fillStyle='#4a3218'; ctx.fillRect(4,-9,3,7);
  ctx.fillStyle='#d9b23a'; ctx.fillRect(3,-10,5,2);
  ctx.restore();
}
function drawPistolItem(it){
  // 권총 아이템 (먹으면 무기가 권총으로 교체/강화)
  ctx.save(); ctx.translate(it.x - camX + 10, it.y + 12 + Math.sin(it.t*2)*2);
  ctx.rotate(Math.sin(it.t)*0.12);
  ctx.fillStyle='#3a3a42'; ctx.fillRect(-10,-3, 18, 5);      // 총신
  ctx.fillStyle='#20232a'; ctx.fillRect(5,-4, 5, 7);         // muzzle
  ctx.fillStyle='#5a4a2a'; ctx.fillRect(-8,2, 6, 8);         // 손잡이
  ctx.fillStyle='#9fb3c0'; ctx.fillRect(-11,-2, 4, 3);       // 조준점
  ctx.restore();
}
function drawHeartItem(h){
  // 하트 (목숨 1 회복)
  ctx.save(); ctx.translate(h.x - camX + 10, h.y + 12 + Math.sin(h.t*2.5)*2.5);
  const s = 1 + Math.sin(h.t*3)*0.06;
  ctx.scale(s,s);
  ctx.fillStyle='#e5453a';
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-11, 0, -8, -9, 0, -4);
  ctx.bezierCurveTo(8, -9, 11, 0, 0, 8);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(-3,-3,1.8,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawBullet(bl){
  const x = bl.x-camX;
  // 탄환 (잔상 + 탄심)
  ctx.strokeStyle='rgba(255,230,150,0.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x - Math.sign(bl.vx)*12, bl.y); ctx.lineTo(x, bl.y); ctx.stroke();
  ctx.fillStyle='#ffe9a0';
  ctx.fillRect(x-3, bl.y-1.5, 6, 3);
  ctx.fillStyle='#fff';
  ctx.fillRect(x-1, bl.y-1, 3, 2);
}
function drawBlade(bd){
  const x = bd.x - camX;
  ctx.save();
  ctx.translate(x, bd.y);
  ctx.rotate(bd.rot);
  // 원형 몸체(은색) + 테두리
  ctx.fillStyle='#cfd8dc'; ctx.beginPath(); ctx.arc(0,0,bd.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#60707a'; ctx.lineWidth=2; ctx.stroke();
  // 회전 톱니 3개
  ctx.fillStyle='#b0bec5';
  for(let i=0;i<3;i++){
    ctx.rotate(Math.PI*2/3);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(bd.r,-7); ctx.lineTo(bd.r,7); ctx.closePath(); ctx.fill();
  }
  // 중심축
  ctx.fillStyle='#263238'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawPlatform(pl){
  ctx.fillStyle='#3a3326';  ctx.fillRect(pl.x-camX, pl.y, pl.w, pl.h);
  ctx.fillStyle='#5a4a26';
  ctx.fillRect(pl.x-camX, pl.y, pl.w, 5);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(pl.x-camX, pl.y+pl.h-2, pl.w, 2);
}
// ★ [S2] 그네 넝쿨 : 나뭇가지에 매달린 채 좌우로 흔들리는 타잔 넝쿨
function drawVineSwing(v){
  const sx = v.px - camX, sy = v.py;
  const ex = v.px + Math.sin(v.ang)*v.len - camX, ey = v.py + Math.cos(v.ang)*v.len;
  // 고정 가지
  ctx.fillStyle='#241a10'; ctx.fillRect(sx-16, sy-12, 32, 12);
  ctx.fillStyle='#3a2a16'; ctx.fillRect(sx-16, sy-12, 32, 4);
  ctx.strokeStyle='rgba(70,104,44,0.9)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx-16, sy-8); ctx.lineTo(sx+16, sy-10); ctx.stroke();
  // 줄기 (진행 방향에 수직으로 살짝 휘어짐)
  const mx=(sx+ex)/2 - (ey-sy)*0.06, my=(sy+ey)/2 + (ex-sx)*0.06;
  ctx.strokeStyle='#3e5a22'; ctx.lineWidth=4.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke();
  ctx.strokeStyle='#557a30'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.quadraticCurveTo(mx-2,my-2,ex,ey); ctx.stroke();
  // 잎사귀
  ctx.fillStyle='#4a7a28';
  for(let k=1;k<=4;k++){
    const tt=k/5, lx=sx+(ex-sx)*tt, ly=sy+(ey-sy)*tt;
    ctx.beginPath(); ctx.ellipse(lx+(k%2?7:-7), ly, 6, 3, (k%2?0.7:-0.7), 0, Math.PI*2); ctx.fill();
  }
  // 잡는 매듭
  ctx.fillStyle='#2c4018'; ctx.beginPath(); ctx.arc(ex, ey, 6.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#5a8a30'; ctx.beginPath(); ctx.arc(ex-2, ey-2, 2.2, 0, Math.PI*2); ctx.fill();
  // ★ 매달려 있을 때 : ↑로 놓으면 날아갈 방향/세기 화살표 (릴리즈 타이밍 가이드)
  if(p.onVine===v){
    const rel = Math.max(-8.5, Math.min(8.5, Math.cos(v.ang)*v.angV*v.len/60*1.2));
    const pw = Math.abs(rel);
    if(pw > 1.2){
      const d = Math.sign(rel), ay = ey + 48, len = 16 + pw*4.5;
      const alpha = 0.30 + Math.min(0.5, pw/12);
      ctx.strokeStyle = 'rgba(255,224,110,' + alpha.toFixed(2) + ')';
      ctx.fillStyle   = 'rgba(255,224,110,' + alpha.toFixed(2) + ')';
      ctx.lineWidth = 3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(ex - d*len, ay); ctx.lineTo(ex + d*(len-10), ay); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ex + d*len, ay);
      ctx.lineTo(ex + d*(len-10), ay-5);
      ctx.lineTo(ex + d*(len-10), ay+5);
      ctx.closePath(); ctx.fill();
    }
  }
}
// ★ [S2] 원주민 독침 : 연록색 바늘 (잔상 + 침)
function drawDart(d){
  const x = d.x - camX;
  const sg = Math.sign(d.vx);
  ctx.strokeStyle='rgba(160,230,120,0.45)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x - sg*14, d.y); ctx.lineTo(x, d.y); ctx.stroke();
  ctx.fillStyle='#8fd44a';
  ctx.beginPath();
  ctx.moveTo(x + sg*7, d.y);
  ctx.lineTo(x - sg*3, d.y-2.4); ctx.lineTo(x - sg*3, d.y+2.4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8ffd0'; ctx.fillRect(x - sg*3, d.y-1.2, 5, 2.4);
}
function drawBlock(b){
  ctx.fillStyle='#6b5a3a';
  ctx.fillRect(b.x-camX, b.y, b.w, b.h);
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=2;
  ctx.strokeRect(b.x-camX, b.y, b.w, b.h);
  ctx.fillStyle='#8a7350';
  ctx.fillRect(b.x-camX+3, b.y+3, b.w-6, b.h-6);
  ctx.strokeStyle='rgba(0,0,0,0.35)';
  ctx.strokeRect(b.x-camX+3,b.y+3,b.w-6,b.h-6);
}

function drawEnemy(e){
  const x = e.x-camX;
  ctx.save(); ctx.translate(x, 0);
  if(e.f<0) ctx.scale(-1,1);
  if(e.kind==='fly'){
    drawFlyer(e);
  } else if(e.native){
    // ★ [S2] 독침 원주민 : 취사군(blowgun)을 든 정글 사냥꾼 (모든 근접 유형 공용 스킨)
    drawGuardBody(14, e.y, 1, false, { armor:'#9a6a3e', trim:'#3e6b2a', helm:'#7a4a28',
      native:true, aim:(e.aim||0)>0, flash:(e.kind==='charge'&&e.st==='tele') });
  } else if(e.kind==='jump'){
    // 창을 든 초록 부족 전사(점퍼)
    drawGuardBody(14, e.y, 1, false, { armor:'#3f6b2a', trim:'#5a8a3a', helm:'#1c2a14', spear:true });
  } else if(e.kind==='charge'){
    // 뿔달린 청동 기사(차저) - 예고할 때 몸이 밝게 빛남
    drawGuardBody(14, e.y, 1, false, { armor:'#3a4a6b', trim:'#52638a', helm:'#141a26', horns:true, flash:(e.st==='tele') });
  } else {
    // 기본 붉은 가드(워커)
    drawGuardBody(14, e.y, 1, false);
  }
  ctx.restore();
  // 피해 플래시
  if(e.hp<=0) return;
}
function drawFlyer(e){
  // 나는 해골박쥐
  const flap = Math.sin((e.t||0)*10)*8;
  ctx.fillStyle='#3a2a1a';
  ctx.beginPath(); ctx.moveTo(6,e.y+8); ctx.lineTo(-8, e.y+2+flap); ctx.lineTo(-2, e.y+14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(18,e.y+8); ctx.lineTo(32, e.y+2+flap); ctx.lineTo(26, e.y+14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e8e2d0';
  ctx.beginPath(); ctx.arc(12,e.y+10,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#201812';
  ctx.beginPath(); ctx.arc(9,e.y+9,2,0,Math.PI*2); ctx.arc(15,e.y+9,2,0,Math.PI*2); ctx.fill();
  ctx.fillRect(10,e.y+14,1.6,2); ctx.fillRect(13,e.y+14,1.6,2);
}
function drawGuardBody(px, py, scale, isBoss, suit){
  suit = suit || {};
  const armor = suit.flash ? '#ffd9d9' : (suit.armor||'#8b2230');
  const trim  = suit.trim || '#a83a48';
  const helm  = suit.helm || '#000000';
  ctx.save(); ctx.translate(px,py); ctx.scale(scale,scale); ctx.translate(-14,0);
  // 다리
  ctx.fillStyle = suit.native ? '#7a4a28' : '#2a2620';
  ctx.fillRect(10,34,7,10); ctx.fillRect(17,34,7,10);
  // 몸 - 갑옷(유형별 색)
  ctx.fillStyle=armor; ctx.fillRect(8,12,19,24);
  ctx.fillStyle=trim; ctx.fillRect(8,12,19,8);
  // 벨트
  ctx.fillStyle='#3a1207'; ctx.fillRect(8,28,19,4);
  // 팔(무기 손)
  ctx.fillStyle=armor; ctx.fillRect(22,14,7,5);
  ctx.fillRect(4,14,6,5);
  // 무기
  if(!isBoss){
    if(suit.native){
      // ★ [S2] 취사군(블로우건) : 대나무 통 + 조준 시 침 끝 반짝임
      ctx.fillStyle='#6b4a26'; ctx.fillRect(20, 5, 30, 3.4);
      ctx.fillStyle='#8a6a3a'; ctx.fillRect(18, 4, 4, 6);
      if(suit.aim){ ctx.fillStyle='#bfe89a'; ctx.beginPath(); ctx.arc(52, 6.7, 2.2, 0, Math.PI*2); ctx.fill(); }
    }
    else if(suit.spear){   // 점퍼: 창
      ctx.fillStyle='#8a6a3a'; ctx.fillRect(24,2,3,26);
      ctx.fillStyle='#dde3e8'; ctx.fillRect(23,0,5,6);
    } else {          // 워커: 검
      ctx.fillStyle='#dde3e8'; ctx.fillRect(20,4,26,3);
      ctx.fillStyle='#8a5a20'; ctx.fillRect(19,3,5,5);
    }
  }
  // 머리
  if(suit.native){
    // ★ [S2] 원주민 : 맨머리 + 붉은 머리띠 + 깃털
    ctx.fillStyle='#9a6a3e'; ctx.beginPath(); ctx.arc(18, 6, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#b03030'; ctx.fillRect(11, 0, 14, 3);
    ctx.fillStyle='#e04838'; ctx.beginPath(); ctx.moveTo(15,-1); ctx.lineTo(13,-10); ctx.lineTo(18,-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f0c030'; ctx.beginPath(); ctx.moveTo(21,-1); ctx.lineTo(23,-9); ctx.lineTo(24,-1); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#1a120a'; ctx.beginPath(); ctx.arc(20, 6, 1.5, 0, Math.PI*2); ctx.fill();
  } else {
  ctx.fillStyle=helm; // 헬멧
  ctx.beginPath(); ctx.arc(18,5,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c9b08a'; ctx.beginPath(); ctx.arc(18,7,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6b1800'; ctx.beginPath(); ctx.arc(18,-1,7,0,Math.PI); ctx.fill();
  }
  // 뿔(차저)
  if(suit.horns){
    ctx.fillStyle='#e8e2d0';
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(4,-7); ctx.lineTo(12,-2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26,0); ctx.lineTo(32,-7); ctx.lineTo(24,-2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawBoss(){
  const b = boss;
  const x = b.x-camX, y = b.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(b.f, 1);
  // 사망 모션: 발끝(17,58)을 축으로 뒤로 쓰러지는 회전 (부드러운 가속)
  if(bossDead){
    const fall = Math.min(1, b.deadFall||0);
    const ease = fall*fall;                     // 점점 빨라지며 쓰러짐
    ctx.translate(17, 58); ctx.rotate(-ease*1.38); ctx.translate(-17, -58);
  }
  const flash = b.hitFx>0;
  const s2 = stage===2;                             // ★ [S2] 정글의 족장 스킨
  const bone  = flash? '#fffbe8' : (s2? '#a87a48' : '#e9e2d0');   // 뼈/피부 색(피격 시 깜빡)
  const shade = flash? '#f2eab8' : (s2? '#8a5f34' : '#cfc5a8');
  const dark  = '#201812';
  const gold  = s2? '#e04838' : '#d9b23a';          // S2=붉은 깃털 왕관

  // 상태별 검 각도 (로컬 +x=플레이어 방향)
  let sw = 0.28 + Math.sin(b.walk*0.5)*0.12;   // 대기 자세
  if(b.state==='telegraph') sw = -1.6;          // 위로 들어올림(예고)
  else if(b.state==='attack'){
    if(b.atk==='combo'||b.atk==='slash1'||b.atk==='slash2') sw = -1.6 + (b.pa||0)*2.7; // 크게 휘두름
    else if(b.atk==='spin') sw = (b.pa||0)*6.3 - 3.0;                                  // 회전베기
    else if(b.atk==='charge') sw = 0.5;                                               // 찌르기
    else if(b.atk==='jump') sw = -1.6;                                                // 내려찍기
  }
  if(!b.walk) b.walk=0;

  // 걷기 애니메이션
  const moving = (b.state==='approach' || ((b.atk==='spin'||b.atk==='charge') && b.state==='attack')) && b.onGround;
  if(moving) b.walk += Math.abs(b.vx)*0.12;
  const leg = moving? Math.sin(b.walk)*5 : 0;

  // 다리 (뼈)
  ctx.strokeStyle=bone; ctx.lineCap='round'; ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(13,44); ctx.lineTo(9+leg, 56); ctx.lineTo(6+leg*1.5, 58);
  ctx.moveTo(21,44); ctx.lineTo(25-leg,56); ctx.lineTo(28-leg*1.5,58);
  ctx.stroke();

  // 골반 + 척추(몸통)
  ctx.fillStyle=bone;
  ctx.beginPath(); ctx.moveTo(17,15); ctx.lineTo(22,42); ctx.lineTo(12,42); ctx.closePath(); ctx.fill();
  ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(14,42,2,0,Math.PI*2); ctx.arc(20,42,2,0,Math.PI*2); ctx.fill();
  // 갈비뼈 (늑골)
  ctx.strokeStyle=bone; ctx.lineWidth=2.6;
  for(let i=0;i<4;i++){ const yy=21+i*4.5, w=6-i*1.1; ctx.beginPath(); ctx.moveTo(17-w, yy); ctx.lineTo(17+w, yy); ctx.stroke(); }
  ctx.lineWidth=3.4; ctx.beginPath(); ctx.moveTo(17,15); ctx.lineTo(17,42); ctx.stroke();
  // 쇄골/어깨
  ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(13,18); ctx.lineTo(8,22); ctx.stroke();

  // 머리 = 해골 (두골 + 눈구멍 + 턱)
  ctx.fillStyle=bone;
  ctx.beginPath(); ctx.arc(17,8,7.5,0,Math.PI*2); ctx.fill();
  ctx.fillRect(13,8,8,6);                               // 턱
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.arc(14,7,2,0,Math.PI*2); ctx.arc(20,7,2,0,Math.PI*2); ctx.fill();   // 눈구멍
  if(bossDead){                                    // 사망: X자 눈
    ctx.strokeStyle=dark; ctx.lineWidth=1.2;
    for(const ex of [14,20]){
      ctx.beginPath();
      ctx.moveTo(ex-2.2, 4.8); ctx.lineTo(ex+2.2, 9.2);
      ctx.moveTo(ex+2.2, 4.8); ctx.lineTo(ex-2.2, 9.2);
      ctx.stroke();
    }
  }
  ctx.fillRect(16,10,2,2); ctx.fillRect(17,10,2,2);      // 코
  ctx.fillStyle=bone;                                     // 이빨
  ctx.fillRect(14,12,1.5,2); ctx.fillRect(16.5,12,1.5,2); ctx.fillRect(19,12,1.5,2);
  // 황금 왕관
  ctx.fillStyle=gold; ctx.fillRect(12,0,10,2.6); ctx.fillRect(14,-4,2,4.6); ctx.fillRect(17,-6,2,6.6); ctx.fillRect(20,-4,2,4.6);

  // 팔 (반대팔 + 칼 드는 팔)
  ctx.strokeStyle=bone; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(10,22); ctx.lineTo(6,28); ctx.stroke();

  // 큰 검 (손잡이 기준으로 sw 각도로 휘두름)
  ctx.save(); ctx.translate(25,20); ctx.rotate(sw);
  ctx.fillStyle = flash? '#fffbe8' : (stage===2? '#b98a4e' : '#d7dde4');   // S2=나무 칼
  ctx.fillRect(0,-2.4, 32, 4.8);                                  // 칼날
  ctx.fillStyle= stage===2? '#8a6a3a' : '#9fb3c0'; ctx.fillRect(16,-2.4, 16, 1.5);        // 칼날 하이라이트
  ctx.fillStyle=gold; ctx.fillRect(-5,-5, 6,10);                 // 가드(황금)
  ctx.fillStyle='#5a3a1a'; ctx.fillRect(-10,-2, 6,4);            // 손잡이
  ctx.restore();

  // 베기 잔상 (속도감)
  if(b.state==='attack' && (b.atk==='combo'||b.atk==='slash1'||b.atk==='slash2') && b.pa>0.1 && b.pa<0.85){
    ctx.strokeStyle='rgba(255,235,200,0.35)'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(17,18, 26, -1.7+b.pa*2.4, -0.4+b.pa*2.4); ctx.stroke();
  }
  // 텔레그래프 표시
  if(b.state==='telegraph'){
    ctx.fillStyle='rgba(255,40,40,0.65)';
    ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText('!', 17, -8-b.hitFx*80);
  }
  ctx.restore();
}

function drawChest(){
  const c = chest;
  // 올라오는 중: 부드러운 가속(smoothstep)으로 바닥 위로 솟음
  const r = Math.min(1, c.rise);
  const ease = r*r*(3-2*r);
  const x = c.x - camX;
  const y = (11*TILE - 30) + (1-ease)*58;     // 완전히 올라오면 바닥(row11)에 앉음
  ctx.save();
  if(c.opened){
    const lt = Math.min(1, c.openT/0.35);              // 빛 퍼짐 진행
    const fade = Math.max(0, 1 - c.openT/3);           // 서서히 잦아듦
    // 하늘로 뻗는 빛 기둥
    const g1 = ctx.createLinearGradient(0, y-170, 0, y+16);
    g1.addColorStop(0, 'rgba(255,250,210,0)');
    g1.addColorStop(1, 'rgba(255,250,210,'+(0.55*fade)+')');
    ctx.fillStyle = g1; ctx.fillRect(x-16, y-170, c.w+32, 180);
    // 상자 안의 빛 (방사형 글로우)
    const rg = ctx.createRadialGradient(x+c.w/2, y+10, 2, x+c.w/2, y+10, 10+50*lt);
    rg.addColorStop(0, 'rgba(255,252,225,'+(0.85*fade)+')');
    rg.addColorStop(1, 'rgba(255,252,225,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x+c.w/2, y+10, 10+50*lt, 0, Math.PI*2); ctx.fill();
  }
  // 몸통 (나무 + 황금 밴딩)
  ctx.fillStyle='#6b4a24'; ctx.fillRect(x, y+12, c.w, 18);
  ctx.fillStyle='#8a6234'; ctx.fillRect(x, y+12, c.w, 5);
  ctx.fillStyle='#d9b23a';
  ctx.fillRect(x+2, y+12, 4, 18); ctx.fillRect(x+c.w-6, y+12, 4, 18);
  ctx.fillRect(x+c.w/2-3, y+14, 6, 9);
  if(!c.opened){
    // 닫힌 뚜껑 + 자물쇠
    ctx.fillStyle='#7a5a2c'; ctx.fillRect(x-2, y+4, c.w+4, 10);
    ctx.fillStyle='#d9b23a'; ctx.fillRect(x, y+4, c.w, 3);
    ctx.fillStyle='#d9b23a'; ctx.fillRect(x+c.w/2-4, y+1, 8, 6);
    ctx.fillStyle='#5a3a1a'; ctx.fillRect(x+c.w/2-1, y+4, 2, 3);
  } else {
    // 열린 뚜껑 (뒤통수 쪽으로 젖혀짐)
    const lid = Math.min(1, c.openT/0.3);
    ctx.save(); ctx.translate(x-2, y+13); ctx.rotate(-lid*2.1);
    ctx.fillStyle='#7a5a2c'; ctx.fillRect(0, -10, c.w+4, 10);
    ctx.fillStyle='#d9b23a'; ctx.fillRect(2, -10, c.w, 3);
    ctx.restore();
    // 쏟아지는 보석 더미 (상자 입구)
    for(let i=0;i<4;i++){
      ctx.fillStyle=['#ffd75a','#7fe3a0','#ff8fb3','#9fd8ff'][i];
      const gx = x+6+i*8, gy = y+12 - Math.sin(c.openT*3+i)*2;
      ctx.beginPath(); ctx.moveTo(gx,gy-4); ctx.lineTo(gx+4,gy); ctx.lineTo(gx,gy+4); ctx.lineTo(gx-4,gy); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
  // 개봉 직후 화면 전체 밝은 플래시
  if(c.opened && c.openT<0.7){
    ctx.fillStyle='rgba(255,255,240,'+(0.55*(1-c.openT/0.7))+')';
    ctx.fillRect(0,0,W,H);
  }
}

function drawPlayer(){
  const x = p.x-camX, y = p.y;
  const face = p.facing;
  ctx.save();
  ctx.translate(x, y);   // ★ y를 0이 아닌 p.y 로: 주인공을 제자리(땅)에 그린다
  const hurt = p.hurtInv>0 && Math.floor(p.hurtInv*20)%2===0;
  ctx.globalAlpha = hurt? 0.5 : 1;
  ctx.scale(face,1);
  // ★ 피격 직후 짧은 흰색 플래시 (밝기 증폭으로 실루엣만 빛남)
  if((p.hurtFx||0) > 0){
    try{ ctx.filter = 'brightness(3) saturate(0.4)'; }catch(e){}
  }
  // 앉으면 발끝 기준으로 세로로 압축 → 낮은 자세 (칼날 밑 통과)
  if(p.crouch) ctx.scale(1, p.h/49);
  // 다리 (걷기: 좌우가 번갈아 앞뒤로 휘두르며 발이 움직임)
  const running = Math.abs(p.vx)>0.1 && p.onGround;
  if(!p.dist) p.dist=0;
  if(running) p.dist+=Math.abs(p.vx)*0.65; else p.dist=0;
  const swing = running ? Math.sin(p.dist)*5 : 0;
  const bob = running ? Math.sin(p.dist)*3 : 0;
  ctx.fillStyle='#7a5a33';
  ctx.fillRect(7+swing, 34+bob*0.3, 7, 13); ctx.fillRect(18-swing, 34-bob*0.3, 7, 13);
  // 부츠
  ctx.fillStyle='#3a2710';
  ctx.fillRect(6+swing, 45, 9, 4); ctx.fillRect(17-swing, 45, 9, 4);
  // 몸 - 갈색 외투/자켓
  ctx.fillStyle='#6b4a24'; ctx.fillRect(7,14,20,22);
  ctx.fillStyle='#7a5a2a'; ctx.fillRect(7,14,20,7);
  // 셔츠 위 갈색 허리
  ctx.fillStyle='#4a3218'; ctx.fillRect(7,30,20,4);
  // 벨트 + 무기 표시 (채찍: 허리 고리 / 권총: 손에 들기)
  if(p.weapon==='pistol'){
    ctx.fillStyle='#3a3a42'; ctx.fillRect(22,18,11,4);   // 총신
    ctx.fillStyle='#20232a'; ctx.fillRect(31,17,3,4);    // muzzle
    ctx.fillStyle='#5a4a2a'; ctx.fillRect(22,21,5,6);    // 손잡이
  } else if(p.attack<=0){
    // 채찍 헤르메스
    ctx.strokeStyle='#5a3a15'; ctx.lineWidth=2;

  }

  ctx.fillStyle='#6b4a24'; ctx.fillRect(22,15,7,6); ctx.fillRect(5,16,6,11);
  ctx.fillStyle='#d8b58a'; ctx.fillRect(23,20,6,4); // 손
  // 머리
  ctx.fillStyle='#d8b58a'; ctx.beginPath(); ctx.arc(17,9,6,0,Math.PI*2); ctx.fill();
  // 수염/얼굴 (탐험가)
  ctx.fillStyle='#8a6a3a'; ctx.fillRect(14,7,6,2);
  // 페도라 (인디아나 존스 모자) - 피격으로 벗겨졌으면 안 그림
  //  짙은 흑갈색 + 밝은 리본으로 머리카락/배경과 강한 대비
  if(!p.hatOff){
    ctx.fillStyle='#2e1f0e';
    ctx.beginPath(); ctx.arc(17,7,8,0,Math.PI*2); ctx.fill();   // 챙
    ctx.fillRect(9,5,16,3);                                     // 챙 밴드 라인
    ctx.fillStyle='#c9a15c';                                    // 밝은 리본 (대비 강화)
    ctx.fillRect(9,6,16,1.6);
    ctx.fillStyle='#3a2a14';
    ctx.beginPath(); ctx.arc(17,3,4.5,0,Math.PI); ctx.fill();   // 크라운
    ctx.fillStyle='#241708';
    ctx.beginPath(); ctx.arc(17,4,4.5,0,Math.PI*0.5); ctx.fill(); // 크라운 그늘
  }

  // 공격 시각효과 (무기별: 채찍 스윙 / 권총 머즐 플래시)
  if(p.attack>0){
    const t = p.attackT;
    if(p.weapon==='pistol') drawMuzzleFlash(32, 20, t);
    else drawWhipSwing(28, 20, t);
  }
  ctx.restore();
}

function drawMuzzleFlash(ox, oy, t){
  // 권총 발사 화염 (t: 0→0.18)
  const k = 1 - Math.min(1, t/0.18);
  if(k<=0) return;
  ctx.fillStyle='rgba(255,220,120,'+(0.35+0.45*k)+')';
  ctx.beginPath(); ctx.arc(ox+2, oy, 4+6*k, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,200,'+(0.5*k)+')';
  ctx.beginPath(); ctx.moveTo(ox, oy-3); ctx.lineTo(ox+14+10*k, oy); ctx.lineTo(ox, oy+3); ctx.closePath(); ctx.fill();
}
function drawWhipSwing(ox, oy, t){
  // t: 0→0.28 / 채찍 레벨이 오르면 길이도 함께 늘어남
  const prog = Math.min(1, t/0.28);
  const sc = whipLen()/62;
  const segs = 14;
  ctx.strokeStyle='#7a5a24'; ctx.lineWidth=2.4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  for(let i=1;i<=segs;i++){
    const f = i/segs;
    const ang = -1.15 + f * 1.9;         // 아래→위 스윙
    const cur = prog;
    const rad = (10 + f*34)*sc;
    let xx = ox + Math.cos(ang - (cur*2.2))*rad;
    let yy = oy + Math.sin(ang - (cur*2.2))*rad - cur*16;
    ctx.lineTo(xx, yy);
  }
  ctx.stroke();
  // 엔드 팁
  ctx.fillStyle='#e8d8a0';
  const fx = ox + Math.cos(-1.15 + 1.9 - (prog*2.2))*(10+44)*sc;
  const fy = oy + Math.sin(-1.15 + 1.9 - (prog*2.2))*(10+44)*sc - prog*16;
  ctx.beginPath(); ctx.arc(fx, fy, 3, 0, Math.PI*2); ctx.fill();
}

// ★ 벗겨진 모자: 물리로 떨어져 구르고, 플레이어가 밟으면 다시 쓴다
function updateHats(dt, s){
  for(let i=hats.length-1;i>=0;i--){
    const h = hats[i];
    if(!h.onGround){
      h.vy += 0.4*s; if(h.vy>9) h.vy=9;
      h.y += h.vy*s; h.x += h.vx*s;
      h.rot += h.vr;
      // 바닥 착지 판정
      const r = Math.floor((h.y+h.h)/TILE);
      const c0 = Math.floor(h.x/TILE), c1 = Math.floor((h.x+h.w-1)/TILE);
      for(let c=c0;c<=c1;c++){
        if(isSolidAt(c,r)){ h.y = r*TILE - h.h; h.onGround = true; h.vy=0; h.vx*=0.4; h.vr*=0.3;
          dust(h.x+8, h.y+h.h, 3, 1); break; }
      }
      if(h.y > ROWS*TILE+60){ hats.splice(i,1); continue; }   // 낙하산실 (구덩이로 떨어짐)
    } else {
      h.vx *= 0.9; h.vr *= 0.9;                                  // 굴러 멈춤
      h.x += h.vx*s; h.rot += h.vr*s;
    }
    // 플레이어가 줍기 (접촉하면 다시 쓴다)
    if(overlap(p, {x:h.x-4, y:h.y-4, w:h.w+8, h:h.h+8})){
      p.hatOff = false; hats.splice(i,1);
      sfx('gem'); showToast('모자 회복! 투척한 탐험가의 위엄', 1.4);
      burst(h.x+8, h.y+4, '#d9b23a', 8);
    }
  }
}
function drawHat(h){

}

function drawHUD(){
  // 심장
  for(let i=0;i<p.maxHp;i++){
    const hx = 12+i*22, hy=12;
    ctx.save();
    ctx.fillStyle = i<p.hp ? '#d33' : '#555';
    ctx.beginPath();
    ctx.arc(hx-4, hy, 3.6, 0, Math.PI*2);
    ctx.arc(hx, hy-1, 4, 0, Math.PI*2);
    ctx.moveTo(hx-9, hy+1);
    ctx.lineTo(hx-9, hy+1);
    ctx.beginPath();
    ctx.moveTo(hx-9, hy+2);
    ctx.lineTo(hx-8, hy+6);
    ctx.quadraticCurveTo(hx-4, hy+10, hx, hy+6);
    ctx.lineTo(hx, hy+6);
    ctx.quadraticCurveTo(hx+4, hy+10, hx+6, hy+6);
    ctx.lineTo(hx+7, hy+2);
    ctx.quadraticCurveTo(hx+7, hy-2, hx+4, hy-2);
    ctx.quadraticCurveTo(hx+1, hy-2, hx, hy+1);
    ctx.quadraticCurveTo(hx-1, hy-2, hx-5, hy-2);
    ctx.quadraticCurveTo(hx-8, hy-2, hx-9, hy+2);

function drawCredits(ft, t){
  ctx.textAlign='center';
  const lines = [
    ['— LOST TEMPLE —', '22 serif gold'],
    ['잃어버린 사원', '20 serif dim'],
    ['', ''],
    ['S T A F F', '18 sans amber'],
    ['', ''],
    ['기획 · 개발', '13 sans dim'],
    ['jongkoo-lim × OpenCode', '17 sans light'],
    ['', ''],
    ['게임 디자인 · 레벨 디자인', '13 sans dim'],
    ['jongkoo-lim', '17 sans light'],
    ['', ''],
    ['아트 · 배경', '13 sans dim'],
    ['Canvas 2D', '17 sans light'],
    ['', ''],
    ['사운드', '13 sans dim'],
    ['WebAudio', '17 sans light'],
    ['', ''],
    ['플레이해 주셔서 감사합니다', '22 serif gold'],
    ['THANK YOU FOR PLAYING', '13 sans dim'],
    ['', ''],
    ['', ''],
    ['In Memoriam', '16 sans amber'],
    ['', ''],
  ];
  const memoIdx = lines.length;                            // 헌정 멘트는 마지막 줄
  const LH = 34;
  const speed = 42;
  // 스크롤량: 마지막 줄이 화면 중앙에 오면 정지
  const scrollMax = H + 60 + (memoIdx-1)*LH - H/2;
  const scroll = Math.min(Math.max(0,t)*speed, scrollMax);
  ctx.save();
  ctx.globalAlpha = ft;
  for(let i=0;i<lines.length;i++){
    const y = H + 60 + i*LH - scroll;
    if(y < -20 || y > H+40) continue;
    const [txt, style] = lines[i];
    if(!txt) continue;
    if(style.includes('gold'))      { ctx.fillStyle='#ffe36b'; ctx.font='bold 22px serif'; }
    else if(style.includes('dim'))  { ctx.fillStyle='#b99a6a'; ctx.font='14px sans-serif'; }
    else if(style.includes('amber')){ ctx.fillStyle='#e8b45a'; ctx.font='bold 18px sans-serif'; }
    else if(style.includes('light')){ ctx.fillStyle='#e8d8b8'; ctx.font='17px sans-serif'; }
    ctx.fillText(txt, W/2, y);
  }
  // 헌정 멘트 (마지막, 정지 시 중앙) - 은은한 글로우와 함께
  const my = H + 60 + memoIdx*LH - scroll;
  if(my > -20 && my < H+60){
    const glow = ctx.createRadialGradient(W/2, my, 4, W/2, my, 130);
    glow.addColorStop(0,'rgba(255,220,120,0.22)');
    glow.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(W/2, my, 130, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a2c14'; ctx.font='bold 26px serif';
    ctx.fillText('채승주 파트장님을 기억합니다', W/2+1.5, my+1.5);
    ctx.fillStyle='#ffe9a8'; ctx.font='bold 26px serif';
    ctx.fillText('채승주 파트장님을 기억합니다', W/2, my);
  }
  ctx.restore();
}

  ctx.fillStyle='#2c1607';
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=48) ctx.lineTo(x, 340 - (Math.sin(x*0.008+2)*30 + Math.sin(x*0.02)*14 + 40));
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1c0e05';

  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // 밀림 나무 실루엣 (좌우 프레임)
  ctx.fillStyle='#120a04';
  for(const [tx, sc] of [[60,1.2],[W-80,1.4],[W*0.28,0.8],[W*0.82,1.0]]){
    ctx.fillRect(tx-5*sc, 210, 10*sc, 270);
    ctx.beginPath(); ctx.ellipse(tx, 200, 70*sc, 46*sc, 0, 0, Math.PI*2); ctx.fill();
  }
  // 바닥 길
  ctx.fillStyle='#160b03'; ctx.fillRect(0, 480, W, H-480);
  ctx.fillStyle='rgba(255,180,90,0.08)'; ctx.fillRect(0, 480, W, 3);
  // 걸어가는 인디아나 실루엣
  const wx = 130 + Math.min(1, t/5.2) * (W*0.52 - 130);
  drawIndyWalk(wx, 480, t);
  // 자막 (순차 페이드인)
  ctx.textAlign='center';
  const fade = s3 => Math.max(0, Math.min(1, (t-s3)/0.8));
  if(t>0.8){
    ctx.globalAlpha = fade(0.8);
    ctx.fillStyle='#ffe9c8'; ctx.font='22px serif';
    ctx.fillText('사원을 빠져나온 인디아나 존스…', W/2, 180);
  }
  if(t>2.0){
    ctx.globalAlpha = fade(2.0);
    ctx.fillStyle='#e8c9a0'; ctx.font='17px serif';
    ctx.fillText('그의 발길은 다시 밀림으로 향한다', W/2, 214);
  }
  if(t>3.2){
    ctx.globalAlpha = fade(3.2);
    ctx.fillStyle='#ffe36b'; ctx.font='bold 40px serif';
    ctx.fillText('— STAGE 2 —', W/2, 300);
    ctx.fillStyle='#c9e89a'; ctx.font='bold 24px serif';
    ctx.fillText('정글의 원주민', W/2, 340);
  }
  ctx.globalAlpha = 1;
  if(t>4.4){
    ctx.globalAlpha = fade(4.4);
    const pulse = Math.floor(performance.now()/500)%2===0;
    ctx.fillStyle = pulse? '#fff' : '#ffd95a'; ctx.font='bold 17px sans-serif';
    ctx.fillText('ENTER → 바로 시작', W/2, 560);
    ctx.globalAlpha = 1;
  }
  // 시작 직후 검은 막 걷힘 / 종료 직전 검은 막 내림 (fadeout)
  if(t<0.8){ ctx.fillStyle='rgba(0,0,0,'+(1-t/0.8)+')'; ctx.fillRect(0,0,W,H); }
  if(t>6.3){ ctx.fillStyle='rgba(0,0,0,'+Math.min(1,(t-6.3)/0.5)+')'; ctx.fillRect(0,0,W,H); }
}
// 실루엣 걷는 인디아나 : 페도라 + 가방 + 흔들리는 팔다리
function drawIndyWalk(x, groundY, t){
  const ph = t*7.5;
  const sw = Math.sin(ph), sw2 = Math.sin(ph+Math.PI);
  ctx.save(); ctx.translate(x, groundY);
  ctx.fillStyle='#0c0702'; ctx.strokeStyle='#0c0702';
  // 다리
  ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(sw*9, -2); ctx.lineTo(sw*11, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(sw2*9, -2); ctx.lineTo(sw2*11, 0); ctx.stroke();
  // 몸통 (코트)
  ctx.beginPath(); ctx.moveTo(-7,-40); ctx.lineTo(7,-40); ctx.lineTo(9,-18); ctx.lineTo(-9,-18); ctx.closePath(); ctx.fill();
  // 가방 끈 + 가방
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-6,-38); ctx.lineTo(7,-24); ctx.stroke();
  ctx.fillStyle='#1a1206'; ctx.fillRect(6,-26,10,12);
  // 팔
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,-36); ctx.lineTo(sw2*8,-24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-36); ctx.lineTo(sw*8,-24); ctx.stroke();
  // 머리 + 페도라
  ctx.fillStyle='#0c0702';
  ctx.beginPath(); ctx.arc(0,-46,6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-50,12,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-52,6,Math.PI,0); ctx.fill();
  ctx.restore();
}
function drawGameOver(){
  // GTA풍 연출: 화면이 서서히 검게/세피아로 페이드아웃 → WASTED 떠오름
  const t = Math.min(1, overTimer/1.2);            // 1.2초 페이드
  ctx.fillStyle='rgba(10,4,2,'+(0.85*t)+')';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  if(t>=1){
    const wt = Math.min(1, (overTimer-1.2)/0.8);   // WASTED 등장 페이드인
    ctx.globalAlpha = wt;
    ctx.fillStyle='#7a1010'; ctx.font='bold 92px serif';
    ctx.fillText('Wasted', W/2, H/2-10);
    ctx.fillStyle='#c9302c'; ctx.font='bold 90px serif';
    ctx.fillText('Wasted', W/2, H/2-12);
    ctx.globalAlpha = wt;
    ctx.font='16px sans-serif'; ctx.fillStyle='#e8d8b8';
    ctx.fillText(stage===2? '정글의 독침이 당신을 잠재웠다…' : '신전의 어둠이 당신을 집어삼켰다…', W/2, H/2+46);
    ctx.font='bold 22px sans-serif'; ctx.fillStyle='#ffe29a';
    ctx.fillText('ENTER → 다시 도전', W/2, H/2+100);
    ctx.globalAlpha = 1;
  }
}

// ============================================================
//  메인 루프
// ============================================================
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now-last)/1000; last = now;
  if(dt>0.05) dt = 0.05;
  if(paused && state==='play'){ render(); return; }   // 일시정지: 갱신 생략, 화면 유지
  if(hitstop>0){ hitstop -= dt; render(); return; }   // 히트스톱: 몇 프레임 정지 (렌더는 유지)
  if(state==='play') update(dt);
  else if(state==='clear' || state==='gameover' || state==='interlude') update(dt);
  render();
}
// 초기화
function init(){
  buildLevel();
  collectGemsFromGrid();
  resetPlayer();
  state='menu';
  // URL ?credits=1 : 엔딩 크레딧만 바로 재생 (공유/시연용)
  // URL ?stage=2  : Stage 2부터 바로 시작 (빠른 검증용)
  try{
    const usp = new URLSearchParams(location.search);
    if(usp.get('credits')==='1'){
      creditsOnly = true; state='clear'; creditT=3; clearTimer=0;
    }
    if(usp.get('stage')==='2'){ startGame(2); }
  }catch(e){}
  requestAnimationFrame(loop);
}
init();
