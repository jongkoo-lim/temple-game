<head>

<title>잃어버린 사원 - 채찍의 탐험가 (Stage 1)</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a0d;overflow:hidden;
    font-family:'Segoe UI',Arial,sans-serif;color:#e8dcb8;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;user-select:none;}
  #wrap{position:relative;}
  canvas{display:block;border:3px solid #5a4a2a;box-shadow:0 0 40px rgba(0,0,0,.9);background:#000;cursor:crosshair;}

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hintline">
    <b>←/→ or A/D</b> 이동 · <b>Space / ↑ / W</b> 점프 · <b>J / X / 마우스클릭</b> 채찍 · <b>Enter</b> 시작 · <b>R</b> 리셋 · <b>그네</b> ←/→ 흔들기·↑ 도약·↓ 놓기
  </div>
  <div id="foot">CHANN만화풍 원작(페르시아의 왕자)을 오마주한 인디아나 존스풍 탐험 게임입니다.</div>
</div>
<script>
"use strict";
// ============================================================
//  잃어버린 사원 — Stage 1  (PoP풍 횡스크롤 / 인디아나 존스 모티브)
// ============================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 960, H = 540;

const TILE = 32;
const COLS = 200, ROWS = 18;

// ---------- 상태 ----------
let keys = {};
let state = 'menu';       // menu | play | clear | gameover
let camX = 0;
let score = 0, gems = 0;
let clearTimer = 0, overTimer = 0;
let creditT = 0;                    // 엔딩 크레딧 스크롤 시간
let creditsOnly = false;            // 크레딧 단독 재생 모드 (메뉴 C키 / URL ?credits=1)
let paused = false;                 // P 키 일시정지
let hitstop = 0;                    // 히트스톱: 타격 순간 게임을 몇 프레임 멈춰 무게감 부여
let hats = [];                      // 벗겨져 날아간 인디아나 존스 모자 (줍기 가능)
let shake = 0;
let startTime = 0;

// ---------- 오디오 (WebAudio 비프) ----------
let actx = null;
function sfx(type){
  try{
    if(!actx){ const AC = window.AudioContext||window.webkitAudioContext; actx = new AC(); }
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    let f = 0, dur = 0.12, vol = 0.16;
    if(type==='whip')   { f=90; dur=0.10; vol=0.28; }
    else if(type==='hit'){ f=200; dur=0.12; vol=0.20; }
    else if(type==='jump'){ f=340; dur=0.09; vol=0.12; }
    else if(type==='gem'){ f=740; dur=0.11; vol=0.16; }
    else if(type==='block'){ f=160; dur=0.08; vol=0.18; }
    else if(type==='boss'){ f=70; dur=0.5; vol=0.22; }
    else if(type==='door'){ f=110; dur=0.7; vol=0.16; }
    else if(type==='slam'){ f=55; dur=0.3; vol=0.26; }
    else if(type==='shoot'){ f=520; dur=0.07; vol=0.2; }
    else if(type==='clear'){ f=520; dur=0.6; vol=0.22; }
    o.type = 'sawtooth';
    o.frequency.value = f;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.start(t); o.stop(t+dur);
  }catch(e){}
}

// ---------- 레벨 데이터 ----------
let level = [];           // 2D array [row][col]
let enemies = [], platforms = [], blocks = [], gemsList = [], particles = [], blades = [];
let bullets = [], pistolItems = [], heartsList = [];
let boss = null;
let gateOpen = false, bossActive = false, bossDead = false;
// 보스 아레나 : 신전의 문 + 진입/잠금 컷신
let doorOpen = false, doorLift = 0;      // 문이 열린 상태 / 문이 위로 올라간 양(px)
let cutscene = 0, csT = 0;               // 0=없음, 1=문 여는 컷신, 2=문 잠그고 보스 개시
const DOOR_H = 4*TILE;                    // 신전의 문 높이(4타일) - 위로 슬라이드
const DOOR_OPEN_T = 1.5, DOOR_SLAM_T = 1.1;
const ARENAL = 161;                       // 어레나 왼쪽 신전 문 컬럼 (확장 후)
const ARENAR = 198;                       // 어레나 오른쪽 끝 컬럼
// 채찍 강화 아이템 / 안내 토스트
let whipItems = [];
let stage = 1;                     // 현재 스테이지 (1=잃어버린 사원, 2=정글의 원주민)
let interT = 0;                    // 스테이지 전환 연출(인터루드) 타이머
let vines = [];                    // [S2] 그네 넝쿨 (구덩이 횡단용)
let darts = [];                    // [S2] 원주민 독침
let vineHp = {};                   // [S2] 넝쿨 장애물 타일 체력
let vineToastDone = false;         // [S2] 넝쿨 잡기 안내 1회 표시
let popups = [];                   // ★ 점수 팝업 (처치/반격 +N 이 떠오름)
let toast = null, toastT = 0;
// 보물 상자 : 보스를 처치하면(1회부터) 쓰러진 자리에서 솟아오르는 특별 보상
let chest = null;
let totalClears = 0;
try{ totalClears = parseInt(localStorage.getItem('templeClears')||'0')||0; }catch(e){}
const CHEST_CLEAR_REQ = 1;   // 첫 처치부터 상자 등장
function showToast(msg, dur){ toast = msg; toastT = dur||1.6; }
let checkpoint = { x: 64, y: 460 };
let cpAdv1 = false, cpAdv2 = false;

function isSolidAt(c, r){
  if(c<0||c>=COLS) return true;
  if(r<0) return true;
  if(r>=ROWS) return false;
  const ch = level[r][c];
  if(ch==='#') return true;
  if(ch==='K') return true;               // 뼈 섬(어레나 바닥)
  if(ch==='W') return true;               // [S2] 넝쿨 장애물 (채찍으로 절단 가능)
  if(ch==='D' && !doorOpen) return true;  // 신전의 문 (열리면 통과)
  if(ch==='G' && !gateOpen) return true;
  if(ch==='A' && bossActive) return true; // 보스 아레나: 진입 후에만 폐쇄
  return false;
}
function tileAt(c,r){ if(c<0||c>=COLS||r<0||r>=ROWS) return '.'; return level[r][c]; }

// ---------- 사다리 ----------
const CLIMB_SPEED = 2.6;                 // 사다리 위아래 이동 속도
const STAND_H = 44, CROUCH_H = 28;       // 서기/앉기 높이 (앉으면 칼날을 밑으로 통과)
function onLadder(b){
  const c0=Math.floor(b.x/TILE), c1=Math.floor((b.x+b.w-1)/TILE);
  const r0=Math.floor(b.y/TILE), r1=Math.floor((b.y+b.h-1)/TILE);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS) continue;
    if(level[r][c]==='L') return true;
  }
  return false;
}

// ---------- 물리 ----------
function bodyFree(x,y,w,h){
  const r0=Math.floor(y/TILE), r1=Math.floor((y+h-1)/TILE);
  const c0=Math.floor(x/TILE), c1=Math.floor((x+w-1)/TILE);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(r<0||r>=ROWS) continue;
    if(isSolidAt(c,r)) return false;
  }
  return true;
}
function inSolid(b){ return !bodyFree(b.x,b.y,b.w,b.h); }

// 고전 방식의 정확한 타일 충돌: X → Y(바닥/천장 모두) → 잔여 끼임 위로 빼냄
// 바닥이 없다며 위험하게 공중정지 체류 -> 아래 바닥으로 즉시 이동(붕 떠서 못 내려오는 상태 차단)
function findGroundY(x, yTop, w, h){
  const c0=Math.floor((x+1)/TILE), c1=Math.floor((x+w-1)/TILE);
  for(let r=Math.floor((yTop+h)/TILE); r<ROWS; r++){
    for(let c=c0;c<=c1;c++) if(isSolidAt(c,r)) return r*TILE - h;
  }
  return null;
}
const AIR_TOO_LONG = 0.6; // 이 시간 이상 바닥 없이 떠 있으면 아래 바닥으로 강제 이동
// 고전 방식의 정확한 타일 충돌: X → Y(바닥/천장 모두) → 잔여 끼임 위로 빼냄
function moveBody(b, s){
  b.hitWall = 0;
  // ---- X : 이동 방향의 선두 열과 겹치면 벽면으로 밀어냄
  if(b.vx !== 0){
    b.x += b.vx * s;
    const dir = b.vx>0 ? 1 : -1;
    const c  = Math.floor((dir>0 ? (b.x+b.w) : b.x)/TILE);   // 선두 열 (반드시 /TILE)
    const r0 = Math.floor(b.y/TILE), r1 = Math.floor((b.y+b.h-1)/TILE);
    if(c>=0 && c<COLS){
      for(let r=r0;r<=r1;r++){
        if(r<0||r>=ROWS) continue;
        if(isSolidAt(c,r)){
          if(dir>0) b.x = c*TILE - b.w; else b.x = (c+1)*TILE;
          b.vx = 0; b.hitWall = dir;
          break;
        }
      }
    }
  }
  // ---- Y : 이동 방향에 따라 바닥(하강/정지) / 천장(상승)을 검사해 밀어냄
  b.y += b.vy * s;
  if(b.vy > 0){
    // 하강: 발 아래 첫 고체 위에 앉힘
    const r = Math.floor((b.y+b.h)/TILE);
    let landed = false;
    if(r>=0 && r<ROWS){
      const c0=Math.floor((b.x+1)/TILE), c1=Math.floor((b.x+b.w-1)/TILE);
      for(let cc=c0;cc<=c1;cc++){
        if(isSolidAt(cc,r)){ b.y = r*TILE - b.h; b.vy=0; landed=true; break; }
      }
    }
    b.onGround = landed;
  } else if(b.vy < 0){
    // 상승: 머리 위 고체면 아래로 밀어내고 상승 중단
    const r = Math.floor(b.y/TILE);
    if(r>=0 && r<ROWS){
      const c0=Math.floor((b.x+1)/TILE), c1=Math.floor((b.x+b.w-1)/TILE);
      for(let cc=c0;cc<=c1;cc++){
        if(isSolidAt(cc,r)){ b.y = (r+1)*TILE; b.vy=0; break; }
      }
    }
    b.onGround = false;
  } else {
    // 정지: 바로 아래 타일이 있으면 지면으로 인정 (점프 가능하게)
    const r = Math.floor((b.y+b.h+1)/TILE);
    let grounded = false;
    if(r>=0 && r<ROWS){
      const c0=Math.floor((b.x+1)/TILE), c1=Math.floor((b.x+b.w-1)/TILE);
      for(let cc=c0;cc<=c1;cc++){ if(isSolidAt(cc,r)){ grounded=true; break; } }
    }
    b.onGround = grounded;
  }
  // ---- 완화된 안전장치 : 그래도 타일에 끼였으면 위로 최대 64px 빼냄
  if(inSolid(b)){
    for(let dy=1; dy<=64; dy++){
      if(bodyFree(b.x, b.y-dy, b.w, b.h)){ b.y -= dy; b.vy = 0; break; }
    }
  }
}
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

// ---------- 플레이어 ----------
const p = {
  x:64, y:460, w:26, h:44, vx:0, vy:0, onGround:false, hitWall:0,
  facing:1, speed:3.4, jumpV:11.6,
  hp:5, maxHp:5, hurtInv:0, coyote:0, jumpBuf:0,
  attack:0, attackT:0, whipCd:0, hitSet:new Set(),
  onPlate:false, climbing:false, crouch:false, whipLv:1,
  weapon:'whip', pistolLv:1, ammo:0, maxAmmo:0, reloadT:0
};

function resetPlayer(){
  p.x = checkpoint.x; p.y = checkpoint.y; p.vx=0; p.vy=0; p.hp=5;
  p.hurtInv=1.2; p.attack=0; p.attackT=0; p.onGround=false;
  p.onVine = null; p.vineCd = 0;        // [S2] 그네 상태 초기화
  p.hatOff = false; hats.length = 0;     // 새 게임 시작: 모자 초기화
}
function respawn(){
  p.hp--;
  if(p.hp<=0 && state==='play'){ p.hp=0; state='gameover'; overTimer=0; return; }
  p.x = checkpoint.x; p.y = checkpoint.y; p.vx=0; p.vy=0; p.hurtInv=1.5;
  p.onVine = null; p.vineCd = 0;        // [S2] 그네 상태 초기화
  spawnEnemies();          // 적도 플레이어와 함께 리스폰 (전멸/이동 상태 초기화)
  showToast('리스폰! 적들이 다시 몰려온다', 1.4);
}

function tryAttack(){
  // 보물 상자: 근처에서 공격 입력 시 즉시 개봉 (무기/탄약과 무관)
  if(openChestIfNear()) return;
  // 현재 장착 무기에 따라 분기: 권총을 먹으면 채찍은 사용 불가 (그 반대도)
  if(p.weapon==='pistol') tryShoot();
  else tryWhip();
}
function tryWhip(){
  if(p.weapon!=='whip') return;   // 권총 장착 중엔 채찍 사용 불가
  if(p.attack>0 || p.whipCd>0) return;
  p.attack = 0.28; p.attackT = 0; p.hitSet = new Set();
  sfx('whip');
}
function tryShoot(){
  if(p.weapon!=='pistol') return;
  if(p.attack>0 || p.whipCd>0) return;
  if(p.ammo<=0){ sfx('block'); showToast('탄약이 없다… (장전 중)', 1.0); return; }
  p.ammo--;
  p.attack = 0.18; p.attackT = 0; p.hitSet = new Set();
  sfx('shoot');
  // 권총 레벨 = 동시 발사 수 (Lv.1=1발, 레벨업마다 +1발) + 사거리 증가
  const maxDist = 280 + (p.pistolLv-1)*70;
  const shots = p.pistolLv;
  for(let i=0;i<shots;i++){
    const spread = (i-(shots-1)/2)*8;   // 수직으로 퍼져서 동시 발사
    bullets.push({
      x: p.facing>0 ? p.x+p.w+4 : p.x-4,
      y: p.y+20+spread, vx: p.facing*11, vy: 0,
      dist:0, maxDist
    });
  }
  burst(p.x+p.w/2 + p.facing*22, p.y+20, '#ffd75a', 4);   // 머즐 화염 파티클
}
function whipLen(){ return 62 + (p.whipLv-1)*11; }   // 채찍 아이템을 먹을수록 길어짐
function whipHitbox(){
  const d = p.facing;
  const L = whipLen();
  let bx;
  if(d>0) bx = { x:p.x+p.w-6, y:p.y+4, w:L, h:26 };
  else    bx = { x:p.x-L,     y:p.y+4, w:L, h:26 };
  return bx;
}

// ---------- 파티클 ----------
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({ x, y, vx:(Math.random()*6-3), vy:(Math.random()*6-3), life:0.5+Math.random()*0.4,
      color, s:2+Math.random()*3 });
  }
}
// ★ 먼지 파티클 : 위로 살짝 올라가며 퍼지는 옅은 갈색 (점프/착지/달리기)
//   dir=-1 점프(아래로 퍼짐), 1 착지(위로 퍼짐), 2 달리기(뒤로 살짝)
function dust(x,y,n,dir){
  for(let i=0;i<n;i++){
    particles.push({
      x: x+(Math.random()*16-8), y: y-(dir===2?1:0),
      vx: (Math.random()*2.2-1.1) + (dir===2 ? -p.facing*(1+Math.random()) : 0),
      vy: (dir===-1 ? Math.random()*1.6+0.4 : -(Math.random()*1.8+0.4)),
      life: 0.3+Math.random()*0.25, color:'#8a7a5e', s:2+Math.random()*2.5, dust:true });
  }
}

// ---------- 레벨 생성 ----------
function buildLevel(){
  const g = Array.from({length:ROWS},()=>Array(COLS).fill('.'));
  const set=(c,r,ch)=>{ if(c<0||c>=COLS||r<0||r>=ROWS)return; g[r][c]=ch; };
  const fill=(c0,c1,r0,r1,ch)=>{ for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++)set(c,r,ch); };
  const ground=(c0,c1,r0)=>{ fill(c0,c1,r0,ROWS-1,'#'); };

  // 좌우 벽
  fill(0,0,0,ROWS-1,'#');
  fill(COLS-1,COLS-1,0,ROWS-1,'#');

  if(stage===2){
    // ============================================================
    // [S2] 정글의 원주민 : Stage1과 완전히 다른 "이중층(1층/2층)" 정글
    //   1층 = 그네 협곡/가시덤불/칼날 계단/넝쿨 장애물
    //   2층 = 나무 산책로(덩굴 사다리로 승강, 적+아이템, 장애물 우회 루트)
    // ============================================================
    // -- A. 정글 입구 (col1~24) : 1층 평지 + 2층 나무 산책로
    ground(1,24,16);                       // 1층 바닥
    set(7,15,'^'); set(12,15,'^');         // 가시덤불 (점프로 넘기)
    fill(10,20,8,8,'#');                   // ★ 2층 나무 산책로
    for(let r=7;r<=15;r++) set(21,r,'L');  // 2층 승강 덩굴 사다리 (꼭대기가 산책로보다 1행 위 → 옆으로 걸어 올라탐)
    for(let r=10;r<=15;r++) set(19,r,'W'); // 1층 넝쿨 장애물 (절단 통과 / 2층은 위로 우회)
    fill(22,24,14,15,'#');                 // 협곡 직전 계단
    // -- B. 그네 협곡1 (col29~44 낙사 구덩이) : 짧은 넝쿨 3개로만 횡단
    ground(25,28,13);                      // 진입 절벽
    ground(45,48,13);                      // 착지 절벽
    // -- C. 사원 계단 (col49~72) : 한 칸씩 올라가는 계단식 유적 + 칼날 지대
    ground(49,52,12); ground(53,56,11); ground(57,60,10); ground(61,72,9);
    // 칼날 col62~66 (스폰 섹션) - 그네와 완전히 분리 "↓ 앉아서 통과"
    // -- D. 습지 평원 (col73~93) : 낮은 지대로 내려가는 길 + 2층 산책로
    ground(73,93,13);
    set(83,12,'^'); set(87,12,'^');        // 가시덤불
    for(let r=9;r<=12;r++) set(89,r,'W');  // 1층 넝쿨 장애물
    fill(81,90,8,8,'#');                   // ★ 2층 산책로 (장애물 위를 지나감)

  e.aim = 0; e.shootT = 0.6 + Math.random();
}

window.addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.repeat) return;               // 리핏 무시 : 점프버퍼/공격/넝쿨 해제는 "새 누름"만 인정
  // 점프: ↑ 방향키
  if(e.code==='ArrowUp') p.jumpBuf = 0.12;
  // 공격: Space
  if(e.code==='Space') tryAttack();
  if(e.code==='Enter'){
    if(state==='menu') startGame();
    if(state==='clear'||state==='gameover') restart();
    if(state==='interlude') startStage2();   // 연출 스킵
  }
  // 메뉴에서 2 : Stage 2부터 바로 시작 (빠른 검증/시연용)
  if(e.code==='Digit2' && state==='menu'){ startGame(2); }
  // 메뉴에서 C : 엔딩 크레딧만 바로 보기
  if(e.code==='KeyC' && state==='menu'){
    startGame();                       // 상태 초기화 후
    creditsOnly = true; state='clear'; creditT=3; clearTimer=0;
  }
  // 일시정지 : 플레이 중에만 P로 토글
  if(e.code==='KeyP' && state==='play'){
    paused = !paused;
    sfx(paused?'block':'gem');
  }
  if(e.code==='KeyR'){ startGame(stage); state='play'; paused=false; }
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());

// ---------- 게임 제어 ----------
function startGame(stg){
  stage = stg || 1;               // R/재시작은 현재 스테이지부터, 메뉴 시작은 1
  buildLevel();
  collectGemsFromGrid();
  resetPlayer();
  p.whipLv = 1;                  // 새 게임마다 무기 상태 초기화
  p.weapon='whip'; p.pistolLv=1; p.ammo=0; p.maxAmmo=0; p.reloadT=0;
  deadInitDone = false; chest = null;
  score=0; gems=0; state='play'; startTime=performance.now();
  creditT = 0;                    // 엔딩 크레딧 타이머 초기화
  creditsOnly = false;            // 크레딧 단독 모드 해제
  camX = Math.max(0, Math.min(p.x-W/2, COLS*TILE-W));
}
// ★ Stage 1 → 2 전환 : 무기/점수는 유지, 체력 회복 후 정글에서 재시작
function startStage2(){
  stage = 2;
  buildLevel();
  collectGemsFromGrid();
  resetPlayer();                  // 위치/HP(5) 초기화 (whipLv·weapon·score는 유지)
  deadInitDone = false; chest = null;
  state='play'; paused=false;
  camX = Math.max(0, Math.min(p.x-W/2, COLS*TILE-W));
  showToast('STAGE 2 — 정글의 원주민! 독침을 조심하라', 3.2);
}
function restart(){ startGame(stage); }

// ---------- 업데이트 ----------
function update(dt){
  // 천천히 닳듯 건너뛰지 않도록
  const s = Math.min(dt*60, 1.6);
  if(toastT>0) toastT-=dt;
  if(state==='play'){
    if(cutscene>0){ p.vx=0; p.vy=0; }   // 컷신 중 캐릭터 동결
    updatePlayer(dt, s);
    updateEnemies(dt, s);
    updateBlocks(dt, s);
    updatePlatforms(dt);
    updateBlades(dt);
    updateCutscene(dt);
    if(boss) updateBoss(dt, s, bossActive);   // 사망 후에도 쓰러짐/보물상자 시퀀스를 위해 계속 갱신
    updateChest(dt);
    updateHats(dt, s);
    updateGems();
    updateBullets(dt, s);
    updateVines(dt);              // [S2] 그네 넝쿨 흔들림
    updateDarts(dt, s);           // [S2] 원주민 독침
    updatePopups(dt);             // ★ 점수 팝업
    // 권총 탄약 서서히 장전 (탄창이 비면 완전히 막히지 않게)
    if(p.weapon==='pistol' && p.ammo < p.maxAmmo){
      p.reloadT += dt;
      if(p.reloadT >= 5){ p.reloadT = 0; p.ammo++; }
    } else p.reloadT = 0;
    updateParticles(dt);
    updateCam();
  }else if(state==='clear'){
    clearTimer -= dt; creditT += dt; updateParticles(dt);
    if(clearTimer<=0){ /* 프레임 지속 */ }
  }else if(state==='interlude'){
    // ★ Stage1→2 연출 : 밀림으로 걸어가는 존스 (7초 후 자동 진행)
    interT += dt; updateParticles(dt);
    if(interT > 7){ startStage2(); }
  }else if(state==='gameover'){
    overTimer += dt; updateParticles(dt);
  }
  if(shake>0) shake -= dt*30;
}

function updateCam(){
  // 캐릭터가 화면 중앙(+앞쪽)을 향해 나아가되, 한 프레임당 최대 이동량을 제한해
  // "화면이 한꺼번에 러시해서 붙는" 순간이동 느낌이 나지 않게 함
  const tx = p.x + p.facing*30 - W/2;
  let d = (tx - camX)*0.4;
  const maxd = 24;                 // 프레임당 최대 24px (많이 움직여도 급하게 튀지 않음)
  if(d > maxd) d = maxd;
  else if(d < -maxd) d = -maxd;
  camX += d;
  camX = Math.max(0, Math.min(camX, COLS*TILE-W));
}

function updateCutscene(dt){
  // 컷신 시작 감지
  if(cutscene===0){
    if(!doorOpen && !bossDead && center(p).x > 160*TILE){  // 문 앞 도달 → 문 열기
      cutscene=1; csT=0; sfx('door'); return;
    }
    if(doorOpen && !bossActive && !bossDead && center(p).x > 162.5*TILE){ // 방 안 진입 → 문 잠그고 보스
      cutscene=2; csT=0;
    }
    return;
  }
  csT += dt;
  if(cutscene===1){
    // 신전의 문이 위로 미끄러져 열림
    doorLift = Math.min(DOOR_H, (csT/DOOR_OPEN_T)*DOOR_H);
    if(csT >= DOOR_OPEN_T){ doorOpen=true; doorLift=DOOR_H; cutscene=0; }
  } else if(cutscene===2){
    // 문이 내려오며 잠기고 보스 시작
    doorLift = Math.max(0, DOOR_H - (csT/DOOR_SLAM_T)*DOOR_H);
    if(csT >= DOOR_SLAM_T){ doorOpen=false; doorLift=0; bossActive=true; cutscene=0; sfx('boss'); }
  }
}

function updatePlayer(dt, s){
  // 타이머
  if(p.hurtInv>0) p.hurtInv-=dt;
  if(p.whipCd>0) p.whipCd-=dt;
  if(p.attack>0){ p.attackT+=dt; p.attack-=dt; }
  else p.hitSet.clear();
  if(p.jumpBuf>0) p.jumpBuf-=dt;
  if(p.coyote>0) p.coyote-=dt;
  if((p.hurtFx||0)>0) p.hurtFx-=dt;   // ★ 피격 플래시 감쇠
  const prevOn = p.onGround;
  if(cutscene>0){ p.vx=0; p.vy=0; return; }   // 컷신 중엔 조작/중력 모두(door 중간 이동 막음)

  // ★ [S2] 그네 넝쿨 : 매달린 동안엔 일반 물리 대신 넝쿨 끝점을 따라간다
  if(p.onVine){
    const v = p.onVine;
    // ↓ 새 누름 : 점프 없이 현재 흔들림 속도만 실어 그냥 놓기 (낮은 곳으로 내려갈 때)
    const dn = keys['ArrowDown'];
    if(dn && !p._vdHeld){
      p._vdHeld = true;
      const rel = Math.max(-8.5, Math.min(8.5, Math.cos(v.ang)*v.angV*v.len/60*1.2));
      p.vx = rel; p.vy = 2.5;
      p.onVine = null; p.vineCd = 0.35;
      sfx('jump');
    } else if(!dn){ p._vdHeld = false; }
    if(p.onVine){
    if(p.jumpBuf > 0){
      // ↑ 새 누름 : 진자의 접선 속도(탄속)를 실어 점프하며 놓는다
      const rel = Math.max(-8.5, Math.min(8.5, Math.cos(v.ang)*v.angV*v.len/60*1.2));
      p.vx = rel; p.vy = -10.5;
      p.onVine = null; p.vineCd = 0.35; p.jumpBuf = 0; p.onGround = false;
      sfx('jump');
    } else {
      const ex = v.px + Math.sin(v.ang)*v.len, ey = v.py + Math.cos(v.ang)*v.len;
      p.x = ex - p.w/2; p.y = ey - 8;      // 매듭을 두 손으로 잡은 자세
      p.vx = 0; p.vy = 0; p.onGround = false; p.climbing = false;
    }
    }
  }
  const onV = !!p.onVine;

  if(!onV){
  // 이동 : 방향키만 + 짧은 가속/감속으로 무게감 (지상 빠름/공중 느림)
  //  단, 피격 넉백 직후(hurtInv > 0.85)엔 관성 무시 - 밀려나는 힘이 살아있게
  const dir = (keys['ArrowRight']?1:0) - (keys['ArrowLeft']?1:0);
  if(p.hurtInv > 0.85){
    if(dir!==0) p.facing = dir;                     // 방향전환만
  } else {
    const target = dir * p.speed;
    const accel = (p.onGround ? 0.32 : 0.14) * s;   // 지상 0.15s / 공중 0.25s 근처
    if(p.vx < target) p.vx = Math.min(target, p.vx + p.speed*accel);
    else if(p.vx > target) p.vx = Math.max(target, p.vx - p.speed*accel);
    if(dir!==0) p.facing = dir;
  }

  // 사다리 감지/상태 (= 높이 5칸 이상 벽은 ↑/↓로 직접 타고 오름)
  const onLad = onLadder(p);
  const up = keys['ArrowUp'];
  const down = keys['ArrowDown'];
  if((onLad && (up||down)) || (p.climbing && onLad)) p.climbing = true;
  else p.climbing = false;

  if(p.climbing){
    // 사다리 타기: 중력 없이 위/아래, 가로는 자유(벽을 벗어나면 풀림)
    p.vy = up ? -CLIMB_SPEED : (down ? CLIMB_SPEED : 0);
    p.jumpBuf = 0;
  } else {
    if(!p.onGround){ p.vy += 0.55*s; if(p.vy>14) p.vy=14; }
    else { p.vy = 0; p.coyote = 0.1; }
    // 점프 : ↑ 방향키
    const jumpKey = keys['ArrowUp'];
    if(p.jumpBuf>0 && (p.onGround || p.coyote>0)){
      p.vy = -p.jumpV; p.onGround=false; p.coyote=0; p.jumpBuf=0;
      sfx('jump');
      dust(p.x+p.w/2, p.y+p.h, 6, -1);              // ★ 점프 먼지 (아래+양옆으로)
    }
    // 가변 점프 (키 떼면 상승 중단)
    if(!jumpKey && p.vy < -4) p.vy = -4;
  }

  moveBody(p, s);
  // ★ 착지 먼지 : 공중에 있다가 이번 프레임에 지면에 앉음 (+낙하 속도 비례)
  if(!prevOn && p.onGround && p.vy >= 0){
    dust(p.x+p.w/2, p.y+p.h, Math.min(10, 4 + Math.floor(-p._lastVy/3)), 1);
  }
  p._lastVy = p.vy;
  // ★ 달리기 먼지 : 지상에서 빠르게 이동 중 가끔 발밑에서
  if(p.onGround && Math.abs(p.vx) > 2.4 && !p.crouch){
    if(Math.random() < 0.3) dust(p.x+p.w/2-p.facing*8, p.y+p.h, 1, 2);
  }
  // 사다리를 벗어났거나(이동), 착지했으면 사다리 상태 해제
  if(p.climbing && (!onLadder(p) || p.onGround)) p.climbing = false;

  // 앉기(크라우치): 지상에서 ↓ 방향키를 누르면 몸을 낮춰 회전 칼날을 밑에서 통과
  const wantCrouch = p.onGround && down && !p.climbing;
  if(wantCrouch && !p.crouch){ p.h = CROUCH_H; p.y += (STAND_H - CROUCH_H); p.crouch = true; }
  else if(!wantCrouch && p.crouch){ p.h = STAND_H; p.y -= (STAND_H - CROUCH_H); p.crouch = false; }
  if(p.crouch) p.vx = dir * p.speed * 0.55;   // 앉은 채 이동은 느리게

  // 완화된 안전장치 : 같은 지점에 1초 이상 끼어 있으면 리스폰 (영구 끼임 방지)
  p._stT = inSolid(p) ? (p._stT||0) + dt : 0;
  if((p._stT||0) > 1.0){ p._stT = 0; respawn(); return; }

  // 이동발판에 탑승 (발이 발판 상단 부근이면 지면 인정, 상승/하강 무관)
  for(const pl of platforms){
    const pb = p.y + p.h;
    if((p.x+p.w > pl.x+2) && (p.x < pl.x+pl.w-2) && pb >= pl.y-6 && pb <= pl.y+pl.h+4){
      p.onGround = true;
    }
  }
  // 퍼즐 블록에 서기(블록 위에 올라타기도)
  for(const b of blocks){ if(overlap(p,{x:b.x,y:b.y-1,w:b.w,h:b.h}) && p.vy>=0){ p.onGround=true; } }
  }

  // ★ [S2] 그네 넝쿨 잡기 : 공중에서 넝쿨 끝에 닿으면 자동으로 매달림
  if(stage===2){
    if((p.vineCd||0) > 0) p.vineCd -= dt;
    if(!p.onVine && !p.onGround && (p.vineCd||0) <= 0){
      for(const v of vines){
        const ex = v.px + Math.sin(v.ang)*v.len, ey = v.py + Math.cos(v.ang)*v.len;
        const dx = (p.x+p.w/2) - ex, dy = (p.y+12) - ey;
        if(dx*dx + dy*dy < 34*34){
          p.onVine = v; p.vx = 0; p.vy = 0; p.jumpBuf = 0;
          sfx('gem');
          if(!vineToastDone){ vineToastDone = true; showToast('넝쿨을 잡았다! 흔들림에 맞춰 ↑로 뛰어넘자', 2.8); }
          break;
        }
      }
    }
  }

  // 가시/함정 피해
  if(p.hurtInv<=0 && onHazard(p)){
    damagePlayer(1, p.vx<0?1:-1);
  }
  // 추락
  if(p.y > H+40){ respawn(); sfx('boss'); }

  // 체크포인트 갱신 (첫 이동발판 횡단(구덩이1, col58~71)을 넘어가면 고지대에 저장)
  // 체크포인트 갱신 (스테이지별 지형에 맞는 안전 지점)
  if(stage===2){
    if(!cpAdv1 && p.x > 72*TILE){ cpAdv1 = true; checkpoint = {x: 75*TILE, y: 13*TILE-46}; }   // 습지 평원
    if(!cpAdv2 && p.x > 126*TILE){ cpAdv2 = true; checkpoint = {x: 138*TILE, y: 11*TILE-46}; } // 넝쿨 벽 뒤
  } else {
    if(!cpAdv1 && p.x > 72*TILE){ cpAdv1 = true; checkpoint = {x: 75*TILE, y: 11*TILE-46}; }
    if(!cpAdv2 && p.x > 126*TILE){ cpAdv2 = true; checkpoint = {x: 129*TILE, y: 11*TILE-46}; }
  }

  // 채찍 적중 처리 (권총 장착 중엔 채찍 판정 없음 - 발사는 updateBullets가 처리)
  if(p.attack>0 && p.weapon==='whip'){
    const hb = whipHitbox();
    for(const e of enemies){
      if(overlap(hb, e) && !p.hitSet.has(e)){
        p.hitSet.add(e);
        e.hp--; sfx('hit');
        hitstop = 0.05;                                  // ★ 히트스톱: 타격이 꽂히는 무게감
        e.vx = p.facing*4.5; e.vy = -4;
        burst(e.x+e.w/2, e.y+e.h/2, '#ffe9a0', 10);
        if(e.hp<=0){
          // ★ 처치 넉백: 뒤로 날아가며 산산조각
          e.vx = p.facing*7; e.vy = -6.5;
          burst(e.x+e.w/2, e.y+10, '#d44', 16);
          addKillScore(e);                              // ★ 처치 점수 +100 팝업
        }
      }
    }
    // ★ [S2] 채찍으로 독침 튕겨내기 : 원주민 독침을 쳐서 상쇄 (+25)
    for(const d of darts){
      if(!p.hitSet.has(d) && overlap(hb, {x:d.x-6, y:d.y-3, w:12, h:7})){
        p.hitSet.add(d);
        d.life = 0;                                     // 다음 updateDarts에서 제거
        burst(d.x, d.y, '#a0e678', 8); sfx('block');
        score += 25; addPopup(d.x, d.y-10, '+25');
      }
    }
    if(boss && !bossDead && boss.hitCd<=0 && overlap(hb, boss)){
      p.hitSet.add('boss');
      boss.hp--; boss.hitCd = 0.55; boss.hitFx = 0.15;
      sfx('hit');
      hitstop = 0.06;                                    // ★ 보스는 조금 더 묵직하게
      burst(boss.x+boss.w/2, boss.y+10, '#ffdf6b', 14);
      shake = 6;
      if(boss.hp<=0){ bossDead = true; bossDeadInit(); }
    }
    // ★ [S2] 넝쿨 장애물 절단 : 채찍을 대면 잘려서 길이 생김 (타일 hp 1)
    if(stage===2){
      const c0=Math.floor(hb.x/TILE), c1=Math.floor((hb.x+hb.w-1)/TILE);
      const r0=Math.floor(hb.y/TILE), r1=Math.floor((hb.y+hb.h-1)/TILE);
      for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
        if(tileAt(c,r)!=='W') continue;
        const key = 'W'+c+'_'+r;
        if(p.hitSet.has(key)) continue;      // 한 번 휘두름에 타일당 1회
        p.hitSet.add(key);
        damageVine(c, r, p.facing*3);
      }
    }
  }
}
function onHazard(b){
  const c0=Math.floor(b.x/TILE), c1=Math.floor((b.x+b.w-1)/TILE);
  const r0=Math.floor(b.y/TILE), r1=Math.floor((b.y+b.h-1)/TILE);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(tileAt(c,r)==='^') return true;
  }
  return false;
}
function damagePlayer(n, kx){
  p.hp -= n; p.hurtInv = 1.2;
  p.onVine = null; p.vineCd = 0.5;    // [S2] 그네에 매달린 채 피격 시 즉시 놓음
  p.hurtFx = 0.12;                  // ★ 피격 직후 짧게 흰색 플래시
  p.vx = kx*5; p.vy = -4.5;
  shake = 8; sfx('hit');
  burst(p.x+p.w/2, p.y+10, '#e55', 10);
  // ★ 피격 시 모자가 벗겨져 날아감 (이미 벗겨진 상태면 무시)
  if(!p.hatOff){
    p.hatOff = true;
    hats.push({ x:p.x+p.w/2-8, y:p.y, w:16, h:8,
      vx:-kx*(2+Math.random()*1.5), vy:-5-Math.random()*2, onGround:false, rot:0, vr:(-kx*0.15) });
    showToast('모자가 벗겨졌다! 주워서 다시 쓰자', 1.6);
  }
  if(p.hp<=0){ p.hp=0; state='gameover'; overTimer=0; }
}

function updateEnemies(dt, s){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hitCd>0) e.hitCd-=dt;
    // 맵 밖으로 추락한 적은 정리
    if(e.y > ROWS*TILE+80){ enemies.splice(i,1); continue; }
    const dist = Math.abs(playerCenter().x - center(e).x);
    const sameH = Math.abs((p.y+p.h) - (e.y+e.h)) < 34;

    if(e.kind==='fly'){
      // 나는 해골박쥐: 평소 제자리에서 부유, 플레이어가 근처(190px)로 오면 다가들고
      //   지나가면 제자리로 되돌아감 (멀리까지 계속 따라오지 않게)
      e.t += dt;
      const ecx = center(e).x;
      if(dist < 190){
        e.f = playerCenter().x > ecx ? 1 : -1;
        e.x += e.f * 1.25 * s;
      } else {
        const dx = e.mx - ecx;
        if(Math.abs(dx) > 6){ e.f = dx>0 ? 1 : -1; e.x += e.f * 0.85 * s; }
      }
      e.y = e.baseY + Math.sin(e.t*2.4)*26;
      if(e.x < e.mx-e.range){ e.x = e.mx-e.range; }
      if(e.x > e.mx+e.range){ e.x = e.mx+e.range; }
    } else {
      // 지상 적: 중력
      if(!e.onGround){ e.vy += 0.55*s; if(e.vy>13) e.vy=13; }
      else { e.vy = 0; }

      if(e.kind==='walk'){
        // 걷는 가드: 평소 순찰, 플레이어를 발견하면 빠르게 추격
        e.vx = e.f * (e.speed||0.7);
        const chase = dist < 240 && sameH;
        e.speed = chase ? 2.0 : 0.7;
      }
      else if(e.kind==='jump'){
        // 점퍼: 주기적으로 플레이어 쪽으로 크게 점프해 덮침
        e.hopT -= dt;
        if(e.onGround){
          e.vx = e.f*0.5;
          if(e.hopT<=0){
            e.f = playerCenter().x > center(e).x ? 1 : -1;
            e.vy = -8.4; e.vx = e.f*2.4;
            e.hopT = 1.1 + Math.random()*0.7;
          }
        } else { e.vx = e.f*2.0; }
      }
      else if(e.kind==='charge'){
        // 차저: 대기 → 인식하면 예고(0.45초) → 돌진(0.55초) → 휴식
        e.t += dt;
        if(e.st==='idle'){
          e.vx=0;
          if(dist<200 && sameH){ e.st='tele'; e.t=0; e.f = playerCenter().x>center(e).x?1:-1; }
        }
        else if(e.st==='tele'){ e.vx=0; if(e.t>0.45){ e.st='dash'; e.t=0; } }
        else if(e.st==='dash'){ e.vx=e.f*5.2; if(e.t>0.55){ e.st='rest'; e.t=0; } }
        else if(e.st==='rest'){ e.vx=0; if(e.t>0.9){ e.st='idle'; e.t=0; } }
      }
      else { e.vx = e.f * (e.speed||0.7); }

      // ★ [S2] 원주민 독침 : 플레이어를 발견하면 멈춰 조준(0.5초) → 취사군 발사
      if(e.native){
        if(e.aim > 0){
          e.aim -= dt; e.vx = 0;
          if(e.aim <= 0){
            darts.push({ x:e.x+(e.f>0? e.w+2 : -10), y:e.y+16, vx:e.f*5.2, life:2.8 });
            sfx('shoot');
            e.shootT = 1.8 + Math.random()*1.0;   // 독침 재발사 간격 완화 (1.4~2.3s → 1.8~2.8s)
          }
        } else if((e.shootT||0) > 0){ e.shootT -= dt; }
        else if(dist < 300 && sameH && e.onGround && (e.kind!=='charge' || e.st==='idle')){
          e.f = playerCenter().x > center(e).x ? 1 : -1;
          e.aim = 0.5;
        }
      }

      moveBody(e, s);
      // 벽이나 범위 밖이면 뒤집기
      if(e.hitWall!==0){ e.f*=-1; if(e.kind==='charge'&&e.st==='dash'){ e.st='rest'; e.t=0; } }
      // 이동 제한 (차저/점퍼는 조금 더 넓게 / 상층 발판 적은 좁게 발판 위에만)
      const leash = e.leash || (e.kind==='charge'||e.kind==='jump' ? (e.range||150) : 80);
      if(e.x < e.mx-leash){ e.f=1; e.x=e.mx-leash; }
      if(e.x > e.mx+leash){ e.f=-1; e.x=e.mx+leash; }
    }

    // 플레이어 접촉 피해 (공통)
    if(e.hitCd<=0 && p.hurtInv<=0 && overlap(p,e)){
      e.hitCd = 1.0;
      const kx = center(p).x < center(e).x ? -1 : 1;
      damagePlayer(1, kx);
    }
    if(p.vy>5 && p.y+p.h < e.y+12 && overlap(p,e)){
      // 밟기(스탬프) 킬
      e.hp=0; p.vy=-8; sfx('jump');
      burst(e.x+e.w/2,e.y+e.h/2,'#d44',14);
      addKillScore(e);                                  // ★ 처치 점수 +100 팝업
    }
    if(e.hp<=0){ enemies.splice(i,1); }
  }
}
function center(o){ return { x:o.x+o.w/2, y:o.y+o.h/2 }; }
function playerCenter(){ return center(p); }

function updateBlocks(dt, s){
  // 블록 중력
  for(const b of blocks){
    b.vy = 0;
    b.onGround = false;
    // 플레이어가 밀기
    const dir = (keys['ArrowRight']?1:0) - (keys['ArrowLeft']?1:0);
    if(p.attack>0){} 
    // 수평 충돌로 밀기
    if(overlap(p,b)){
      if(p.x+p.w <= b.x+4 && dir>0){ b.vx = 1.6; sfxIfPush(b); }
      else if(p.x >= b.x+b.w-4 && dir<0){ b.vx = -1.6; }
      else { if(b.vx!==0) { b.vx=0; } }
    } else { b.vx = 0; }
    b.x += b.vx * s;
    // 벽 체크
    const c0=Math.floor(b.x/TILE), c1=Math.floor((b.x+b.w-1)/TILE);
    const rTop=Math.floor(b.y/TILE), rBot=Math.floor((b.y+b.h-1)/TILE);
    if(isSolidAt(c1,rBot)||isSolidAt(c1,rTop)) b.x = c1*TILE-b.w;  // 우측
    if(isSolidAt(c0,rBot)||isSolidAt(c0,rTop)) b.x = (c0+1)*TILE;  // 좌측
    // 중력/착지
    b.y += 4*s;  // 가속 일부
    const rr=Math.floor((b.y+b.h)/TILE);
    const r0=Math.floor(b.y/TILE);
    if(isSolidAt(Math.floor((b.x+2)/TILE), rr) || isSolidAt(Math.floor((b.x+b.w-2)/TILE), rr)){
      b.y = rr*TILE - b.h; b.onGround=true; b.vy=0;
    }
    // 스위치 감지
    b.onSwitch = tileAt(Math.floor(b.x/TILE), Math.floor((b.y+b.h-1)/TILE))==='S'
               || tileAt(Math.floor((b.x+b.w-1)/TILE), Math.floor((b.y+b.h-1)/TILE))==='S';
    if(b.onSwitch){ gateOpen = true; b.vx=0; }
  }
}
function sfxIfPush(b){ /* 최소 간격 사운드 */ b._sd = (b._sd||0)-1; if(b._sd<=0){ sfx('block'); b._sd=12; } }

function updateBlades(dt){
  // 회전 칼날: 정해진 위치에서 회전, 플레이어가 사각형 영역으로 겹치면 피해
  for(const bd of blades){
    bd.rot += bd.spd*dt;
    if(p.hurtInv>0) continue;
    // 플레이어 사각형에서 칼날 중심까지의 최단 거리
    const cx = Math.max(p.x, Math.min(p.x+p.w, bd.x));
    const cy = Math.max(p.y, Math.min(p.y+p.h, bd.y));
    const dx = bd.x-cx, dy = bd.y-cy;
    if(dx*dx+dy*dy < bd.r*bd.r)
      damagePlayer(1, (p.x+p.w/2)<bd.x ? 1 : -1);
  }
}
function updatePlatforms(dt){
  for(const pl of platforms){
    pl.t += dt;    const prevX = pl.x;
    const ampX = pl.axis===1 ? 140 : 0;
    if(pl.axis===1) pl.x = pl.baseX + Math.sin(pl.t*0.85)*ampX;
    else            pl.y = pl.baseY + Math.sin(pl.t*0.7)*130;
    // 발이 발판 상단 부근(±6px 위 ~ 두께 안쪽)에 닿으면 올려 앉힘 (상승/하강 무관)
    const pBottom = p.y + p.h;
    const inX = (p.x + p.w > pl.x + 2) && (p.x < pl.x + pl.w - 2);
    const onTop = pBottom >= pl.y - 6 && pBottom <= pl.y + pl.h + 4;
    // 바닥(고체 타일) 위에 서 있을 때는 끌려들어가지 않도록, 공중/구덩이 위일 때만 탑승
    const rGround = Math.floor((p.y+p.h+1)/TILE);
    let onTile = false;
    if(rGround>=0 && rGround<ROWS){
      const c0=Math.floor((p.x+1)/TILE), c1=Math.floor((p.x+p.w-1)/TILE);
      for(let cc=c0;cc<=c1;cc++) if(isSolidAt(cc,rGround)){ onTile=true; break; }
    }
    if(inX && onTop && !onTile){
      p.y = pl.y - p.h; p.vy = 0; p.onGround=true;
      // 수반 이동 : 발판이 이번 프레임 실제로 이동한 변위만큼만 같이 데려감 (비약 방지)
      if(pl.axis===1) p.x += (pl.x - prevX);
    }
  }
}

// ★ [S2] 그네 넝쿨 물리 : 결정론적 sin 진자 (진폭/속도 일정 → 타이밍 파악 가능)
//   매달린 채 ←/→ 를 누르면 펌핑: 진자 움직임 방향과 같은 방향이면 진폭 증가(도약거리↑), 반대면 감속
function updateVines(dt){
  for(const v of vines){
    v.t += dt;
    if(p.onVine===v){
      const dir = (keys['ArrowRight']?1:0) - (keys['ArrowLeft']?1:0);
      if(dir!==0){
        const hv = Math.cos(v.ang) * v.angV;      // 끝점 수평속도 부호 = 현재 진행 방향
        if(hv > 0.15)       v.amp = Math.min(1.35, Math.max(0.55, v.amp + (dir>0 ?  0.30 : -0.36)*dt));
        else if(hv < -0.15) v.amp = Math.min(1.35, Math.max(0.55, v.amp + (dir<0 ?  0.30 : -0.36)*dt));
      }
    }
    const a = v.ph + v.t*v.spd;
    v.ang  = v.amp * Math.sin(a);
    v.angV = v.amp * v.spd * Math.cos(a);
  }
}
// ★ [S2] 원주민 독침 : 직진 투사체 (벽/플레이어에 맞으면 소멸)
function updateDarts(dt, s){
  for(let i=darts.length-1;i>=0;i--){
    const d = darts[i];
    d.x += d.vx*s; d.life -= dt;
    let dead = d.life<=0;
    const c = Math.floor((d.x + (d.vx>0?4:-4))/TILE), r = Math.floor(d.y/TILE);
    if(!dead && isSolidAt(c,r)){ burst(d.x, d.y, '#8fd44a', 4); dead = true; }
    if(!dead && p.hurtInv<=0 && overlap(p, {x:d.x-5, y:d.y-2, w:10, h:5})){
      damagePlayer(1, d.vx>0?1:-1);
      dead = true;
    }
    if(dead) darts.splice(i,1);
  }
}
// ★ [S2] 넝쿨 장애물 절단 : hp 1 → 잘려서 길이 생김 (타일을 '.'로)
function damageVine(c, r, kx){
  const key = c+'_'+r;
  vineHp[key] = (vineHp[key]===undefined ? 1 : vineHp[key]) - 1;
  sfx('hit');
  const cx = c*TILE+16, cy = r*TILE+16;
  burst(cx, cy, '#4a7a2a', 8);
  if(vineHp[key] <= 0){
    level[r][c] = '.';
    burst(cx, cy, '#6a9a3a', 16);
    shake = Math.max(shake, 3);
  }
}
// ★ 처치 점수 : 적을 죽이면 +100 점수 팝업
function addKillScore(e){
  score += 100;
  addPopup(e.x + e.w/2, e.y - 6, '+100');
}
// ★ 점수 팝업 : 황금색 텍스트가 위로 떠오르며 사라짐
function addPopup(x, y, txt){ popups.push({ x, y, txt, t:0 }); }
function updatePopups(dt){
  for(let i=popups.length-1;i>=0;i--){
    const u = popups[i];
    u.t += dt; u.y -= 30*dt;
    if(u.t > 0.85) popups.splice(i,1);
  }
}
function drawPopups(){
  ctx.textAlign='center'; ctx.font='bold 13px Arial';
  for(const u of popups){
    ctx.globalAlpha = Math.max(0, 1 - u.t/0.85);
    ctx.fillStyle = '#ffe36b';
    ctx.fillText(u.txt, u.x - camX, u.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign='left';
}
function updateGems(){
  for(let i=gemsList.length-1;i>=0;i--){
    const g=gemsList[i];
    if(overlap(p,g)){ score+=50; gems++; sfx('gem'); burst(g.x+8,g.y+8,'#ffe36b',10); gemsList.splice(i,1); }
  }
  // 채찍 아이템: 이미 채찍이면 레벨업, 권총이었다면 교체(채찍은 Lv.1부터 재시작)
  for(let i=whipItems.length-1;i>=0;i--){
    const w=whipItems[i];
    if(overlap(p,w)){
      if(p.weapon!=='whip'){
        p.weapon='whip'; p.whipLv=1;
        showToast('채찍으로 교체! Lv.1 (권총 사용 불가)', 2.0);
      } else {
        p.whipLv = Math.min(8, p.whipLv+1);
        showToast('채찍이 길어졌다! Lv.'+p.whipLv, 1.6);
      }
      score+=100; sfx('gem'); burst(w.x+10,w.y+10,'#c9a15a',12);
      whipItems.splice(i,1);
    }
  }
  // 권총 아이템: 채찍이었다면 교체(채찍 사용 불가), 권총이면 레벨업+탄창 +1
  for(let i=pistolItems.length-1;i>=0;i--){
    const it=pistolItems[i];
    if(overlap(p,it)){
      if(p.weapon!=='pistol'){
        p.weapon='pistol'; p.pistolLv=1; p.maxAmmo=5; p.ammo=5; p.reloadT=0;
        showToast('권총 획득! Lv.1 (탄창 5발, 채찍 사용 불가)', 2.0);
      } else {
        p.pistolLv = Math.min(8, p.pistolLv+1);
        p.ammo = p.maxAmmo;      // 강화 시 탄창 가득 리필 (탄창은 기본 5발 고정)
        showToast('권총 강화! Lv.'+p.pistolLv+' (동시 발사 +1, 사거리 증가)', 1.8);
      }
      score+=100; sfx('gem'); burst(it.x+10,it.y+10,'#9fb3c0',12);
      pistolItems.splice(i,1);
    }
  }
  // 하트: 목숨 1 회복 (가득일 땐 남겨둠)
  for(let i=heartsList.length-1;i>=0;i--){
    const h=heartsList[i];
    if(overlap(p,h) && p.hp < p.maxHp){
      p.hp++;
      showToast('목숨 회복! (HP '+p.hp+'/'+p.maxHp+')', 1.4);
      sfx('gem'); burst(h.x+10,h.y+10,'#e5453a',12);
      heartsList.splice(i,1);
    }
  }
}
function updateBullets(dt, s){
  // 권총 탄환: 직진 → 사거리 소진/벽/적중 시 사라짐 (관통 없음)
  for(let i=bullets.length-1;i>=0;i--){
    const bl = bullets[i];
    bl.x += bl.vx*s; bl.y += bl.vy*s;
    bl.dist += Math.abs(bl.vx*s);
    let dead = false;
    // 사거리(레벨이 오르면 길어짐)
    if(bl.dist > bl.maxDist) dead = true;
    // 벽에 맞으면 튕겨 사라짐 (+ [S2] 넝쿨 장애물은 탄환으로도 절단됨)
    const c = Math.floor((bl.x + (bl.vx>0?3:-3))/TILE), r = Math.floor(bl.y/TILE);
    if(!dead && tileAt(c,r)==='W'){ damageVine(c, r, bl.vx>0?3:-3); dead = true; }
    else if(!dead && isSolidAt(c,r)){ burst(bl.x, bl.y, '#cfc8b0', 5); dead = true; }
    // 적 명중: 피를 튀기며 탄환은 소멸 (뚫고 지나가지 않음)
    if(!dead){
      const hb = { x:bl.x-3, y:bl.y-3, w:6, h:6 };
      for(const e of enemies){
        if(overlap(hb, e)){
          e.hp--; sfx('hit');
          hitstop = 0.04;                              // ★ 히트스톱
          e.vx = bl.vx>0 ? 4.5 : -4.5; e.vy = -3;
          burst(e.x+e.w/2, e.y+e.h/2, '#a80f0a', 12);   // 피
          if(e.hp<=0){
            e.vx = bl.vx>0 ? 7 : -7; e.vy = -6.5;      // ★ 처치 넉백
            burst(e.x+e.w/2, e.y+10, '#d44', 16);
            addKillScore(e);                           // ★ 처치 점수 +100 팝업
          }
          dead = true; break;
        }
      }
    }
    // 보스 명중: 역시 피 + 비관통
    if(!dead && boss && !bossDead && boss.hitCd<=0){
      const hb = { x:bl.x-3, y:bl.y-3, w:6, h:6 };
      if(overlap(hb, boss)){
        boss.hp--; boss.hitCd = 0.55; boss.hitFx = 0.15;
        sfx('hit'); shake = 6;
        hitstop = 0.05;                                 // ★ 히트스톱
        burst(bl.x, bl.y, '#a80f0a', 12);
        if(boss.hp<=0){ bossDead = true; bossDeadInit(); }
        dead = true;
      }
    }
    if(dead) bullets.splice(i,1);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.life-=dt;
    if(pt.dust){                                    // 먼지: 중력 없이 퍼지며 잦아듦
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.94; pt.vy*=0.94;
    } else {
      pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.25; pt.vx*=0.98; pt.vy*=0.98;
    }
    if(pt.life<=0) particles.splice(i,1);
  }
}

// ---------- 보스 ----------
function updateBoss(dt, s, active){
  const b = boss;
  if(!active && !bossDead){
    // 아레나 진입 전: 가만히 땅에 서 있게 중력만 적용
    //  (보스 개시는 신전의 문을 닫는 컷신(updateCutscene)이 담당)
    if(!b.onGround) b.vy += 0.55*s;
    moveBody(b, s);
    return;
  }
  if(bossDead){
    if(b.deadT>0){
      b.deadT-=dt;
      // 0.7초에 걸쳐 뒤로 쓰러짐 (진행도 0→1)
      const prev = b.deadFall||0;
      b.deadFall = Math.min(1, prev + dt/0.7);
      if(prev<1 && b.deadFall>=1){          // 땅에 닿는 순간: 먼지 + 화면 흔들림
        burst(b.x+b.w/2, b.y+b.h-6, '#cfc8b0', 18); shake=9; sfx('hit');
      }
      if(b.deadFall<1){                     // 쓰러지는 동안 밀림 감쇠 + 낙하
        if(!b.onGround) b.vy += 0.55*s;
        b.vx *= 0.95;
        moveBody(b, s);
      } else { b.vx=0; b.vy=0; }
      b.hitFx=0.1;
      if(b.deadT<=0){
        if(totalClears >= CHEST_CLEAR_REQ && !chest){
          // 보스 처치 : 쓰러진 자리에서 보물 상자가 솟아오른다! (첫 처치부터)
          chest = { x: Math.max(ARENAL*TILE+16, Math.min(boss.x+boss.w/2-18, 196*TILE-16)),
                    y: 11*TILE-30, w:36, h:30, rise:0, risen:false, opened:false, openT:0 };
          showToast('신전의 바닥이 흔들린다… 무언가 올라온다!', 2.4);
          shake=8; sfx('door');
        } else {
          if(stage===1){ state='interlude'; interT=0; sfx('door'); }   // 상자 없어도 S2로
          else { state='clear'; clearTimer=1.4; sfx('clear'); }
        }
      }
    }
    return;
  }
  if(b.hitCd>0) b.hitCd-=dt;
  if(b.hitFx>0) b.hitFx-=dt;
  b.f = center(b).x > center(p).x ? -1 : 1;

  const pc = center(p), bc = {x:b.x+b.w/2, y:b.y+b.h/2};
  const distX = Math.abs(pc.x-bc.x);

  // 중력 (항상)
  if(!b.onGround) b.vy += 0.55*s;

  // 칼로 상대를 베는 판정 (검이 휘두르는 범위)
  const slashHit = ()=>{
    const hb = { x: b.f>0? b.x+b.w-6 : b.x-76, y:b.y+6, w:82, h:54 };
    if(p.hurtInv<=0 && overlap(p,hb)) damagePlayer(1, b.f);
  };

  if(b.state==='approach'){
    // 거리 유지: 너무 붙으면 물러서고, 멀면 천천히 접근 (전체적으로 느리게)
    if(distX < 56){ b.vx = (pc.x>bc.x? -1:1)*0.6; }
    else          { b.vx = (pc.x>bc.x? 1:-1)*0.9; }
    b.pa = Math.max(0, (b.pa||0) - dt*3);
    if(b.onGround && b.timer<=0){
      b.timer=-1;
      if(distX < 110){                       // 근접: 검 콤보 또는 회전베기
        b.atk = Math.random()<0.65 ? 'combo' : 'spin';
        b.sec = 0.38;
      }
      else if(distX < 305){ b.atk = Math.random()<0.55 ? 'jump' : 'charge'; } // 중거리
      else { b.atk = 'charge'; }             // 원거리: 반드시 돌진
      // 예고(텔레그래프) 시간을 늘려 반응할 틈을 제공
      b.state='telegraph'; b.timer=(b.atk==='jump')?0.68:(b.atk==='charge'?0.62:0.46); b.si=0;
    }
    if(b.timer>0) b.timer-=dt;
  }
  else if(b.state==='telegraph'){
    b.vx=0; b.pa=0.1;   // 검 들어올려 예고
    b.timer-=dt;
    if(b.timer<=0){
      b.state='attack'; b.pa=0;
      if(b.atk==='jump'){
        if(b.onGround){ b.vy=-10.4; b.vx=(pc.x>bc.x?1:-1)*2.4; }
        else { b.state='recover'; b.timer=0.4; }
      }
      else if(b.atk==='charge'){ b.vx=(pc.x>bc.x?1:-1)*4.2; }   // 돌진 속도 완화
      else { b.vx=(pc.x>bc.x?1:-1)*0.8; }   // combo/spin: 살짝 전진하며 베기
    }
  }
  else if(b.state==='attack'){
    const dur = (b.atk==='combo'||b.atk==='slash1'||b.atk==='slash2') ? (b.sec||0.38)
              : (b.atk==='spin' ? 0.72 : b.atk==='charge' ? 0.9 : 0.4);
    b.pa += dt/dur;
    if(b.atk==='combo'){
      // 2연속 베기 (s1 → s2) - 후딜 증가로 두 번째 베기 피할 틈 제공
      if(((b.si===0&&b.pa>0.15&&b.pa<0.75)||(b.si===1&&b.pa>0.15&&b.pa<0.75))) slashHit();
      if(b.pa>=1){ if(b.si===0){ b.si=1; b.pa=0; b.timer2=0.32; } else { b.state='recover'; b.timer=0.7; } }
      if(b.si===1 && b.timer2>0){ b.timer2-=dt; b.pa=0; b.vx=0; }   // 1베기와 2베기 사이 멈춤
    }
    else if(b.atk==='spin'){
      // 회전하며 전진 - 연속 회전베기 (느리게)
      b.vx=(pc.x>bc.x?1:-1)*2.4; slashHit();
      if(b.pa>=1){ b.state='recover'; b.timer=0.7; }
    }
    else if(b.atk==='charge'){
      // 강한 돌진 (첫 타에 강공격) - 피할 수 있는 속도로 완화
      b.vx=(pc.x>bc.x?1:-1)*4.2;
      if(b.pa>0.05 && b.pa<0.5) slashHit();
      if(b.pa>=1){ b.state='recover'; b.timer=0.65; }
    }
    else if(b.atk==='jump'){
      // 공중: 아래로 찍기 (착지 시 광역)
      if(b.onGround){
        if(p.hurtInv<=0 && Math.abs(pc.x-(b.x+b.w/2))<80) damagePlayer(1, b.f);
        burst(b.x+b.w/2, b.y+b.h, '#ffaa55', 16);
        shake=7; sfx('hit');
        b.vx=0; b.state='recover'; b.timer=0.8;
      }
      b.pa=0;
    }
    else{ // 단일 슬래시
      if(b.pa>0.15 && b.pa<0.75) slashHit();
      if(b.pa>=1){ b.state='recover'; b.timer=0.6; }
    }
  }
  else if(b.state==='recover'){
    b.timer-=dt;
    b.pa = Math.max(0,(b.pa||0)-dt*4);   // 칼 내려놓음
    if(b.timer<=0){ b.state='approach'; b.timer = 0.9; }   // 다음 공격까지 여유
  }

  moveBody(b, s);
  // 아레나 안에만 머물게 (신전 문 col161 ~ 우측벽)
  b.x = Math.max(ARENAL*TILE, Math.min(b.x, 196*TILE - b.w));
}
let deadInitDone=false;
function bossDeadInit(){
  if(deadInitDone) return; deadInitDone=true;
  boss.deadT = 1.6; boss.hp=0;
  boss.state='dead'; boss.deadFall=0;                 // 쓰러지는 모션 진행도
  boss.vx = -boss.f*2.2; boss.vy = -3.5;              // 뒤로 밀려나며 공중으로 살짝 뜸
  boss.onGround = false;
  // 누적 클리어 횟수 기록 (브라우저에 저장)
  totalClears++;
  try{ localStorage.setItem('templeClears', String(totalClears)); }catch(e){}
  for(let i=0;i<40;i++)
    burst(boss.x+boss.w/2, boss.y+boss.h/2, i%2? '#fff':'#d99', 1);
  shake=12; sfx('boss');
}
// 갱신 시 bossDead 리셋을 위해 startGame에서 처리를 위해 아래에서 deadInitDone 재설정
